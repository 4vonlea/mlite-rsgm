<div class="rsgm-pasien-box">
  <div class="rsgm-pasien-head">
    <span><i class="fa fa-users"></i> Hasil Pencarian Pasien &mdash; Klik baris untuk memilih</span>
    <button type="button" class="rsgm-pasien-close"><i class="fa fa-times"></i> Tutup</button>
  </div>
  <div class="rsgm-pasien-scroll">
    <table class="table table-striped table-hover" width="100%">
      <thead>
        <tr>
          <th>Nomor RM</th>
          <th>Nama Pasien</th>
          <th>Nomor Rawat</th>
        </tr>
      </thead>
      <tbody>
        {if: $pasien}
        {loop: $pasien}
        <tr class="pilih"
          data-no_rkm_medis="{?=isset_or($value.no_rkm_medis)?}"
          data-nm_pasien="{?=isset_or($value.nm_pasien)?}"
          data-no_rawat="{?=isset_or($value.no_rawat)?}">
          <td><strong>{?=isset_or($value.no_rkm_medis)?}</strong></td>
          <td>{?=isset_or($value.nm_pasien)?}</td>
          <td>{?=isset_or($value.no_rawat)?}</td>
        </tr>
        {/loop}
        {else}
        <tr>
          <td colspan="3" class="text-center text-muted">Pasien tidak ditemukan.</td>
        </tr>
        {/if}
      </tbody>
    </table>
  </div>
</div>
