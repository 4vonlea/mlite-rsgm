<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-pencil-square-o"></i> Form RM.RI 05A - Asesmen Medis Rawat Inap Gigi</h3>
    </div>
    <div class="panel-body">
        <form action="{?=url([ADMIN, 'form_rme', 'rimedisgigisave'])?}" method="POST" id="formRimedisgigi">
            <input type="hidden" name="id" value="{$data.id}">

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. Rawat <span class="text-danger">*</span></label>
                        {if: !empty($data.no_rawat)}
    <input type="text" name="no_rawat" id="no_rawat" class="form-control" value="{$data.no_rawat}" readonly style="background-color: #f8fafc; font-weight: bold; color: #1d4ed8;">
{else}
    <input type="text" name="no_rawat" id="no_rawat" class="form-control" value="{$data.no_rawat}" required placeholder="Contoh: 2022/11/14/000001">
{/if}
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. RM &amp; Nama Pasien</label>
                        <input type="text" id="info_pasien" class="form-control" value="{$data.no_rkm_medis} - {$data.nm_pasien}" readonly>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>Tgl Asesmen</label>
                        <input type="date" name="tgl_asesmen" class="form-control" value="{$data.tgl_asesmen}">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>Jam Asesmen</label>
                        <input type="time" name="jam_asesmen" class="form-control" value="{$data.jam_asesmen}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Ruangan</label>
                        <input type="text" name="ruangan" class="form-control" value="{$data.ruangan}" placeholder="Contoh: IRNA Gigi / Kelas 1">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Kelas</label>
                        <input type="text" name="kelas" class="form-control" value="{$data.kelas}" placeholder="Contoh: 1 / VIP / 2">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Sumber Anamnesis</label>
                        <select name="anamnesis_sumber" class="form-control">
                            <option value="Autoanamnesis" {if: $data.anamnesis_sumber == 'Autoanamnesis'}selected{/if}>Autoanamnesis</option>
                            <option value="Alloanamnesis" {if: $data.anamnesis_sumber == 'Alloanamnesis'}selected{/if}>Alloanamnesis</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- ANAMNESIS -->
            <div class="panel panel-default">
                <div class="panel-heading"><h4 class="panel-title">I. Anamnesis</h4></div>
                <div class="panel-body">
                    <div class="form-group">
                        <label>Keluhan Utama</label>
                        <textarea name="keluhan_utama" class="form-control" rows="2">{$data.keluhan_utama}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Riwayat Penyakit Sekarang</label>
                        <textarea name="riwayat_penyakit_sekarang" class="form-control" rows="2">{$data.riwayat_penyakit_sekarang}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Riwayat Penyakit Dahulu</label>
                                <input type="text" name="riwayat_penyakit_dahulu" class="form-control" value="{$data.riwayat_penyakit_dahulu}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Riwayat Pengobatan</label>
                                <input type="text" name="riwayat_pengobatan" class="form-control" value="{$data.riwayat_pengobatan}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Riwayat Alergi</label>
                                <input type="text" name="riwayat_alergi" class="form-control" value="{$data.riwayat_alergi}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TANDA VITAL & FISIK UMUM -->
            <div class="panel panel-info">
                <div class="panel-heading"><h4 class="panel-title">II. Tanda Vital &amp; Fisik Umum</h4></div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>TD (mmHg)</label>
                                <input type="text" name="vital[tensi]" class="form-control" value="{$vital.tensi}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Nadi (x/m)</label>
                                <input type="text" name="vital[nadi]" class="form-control" value="{$vital.nadi}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Napas (x/m)</label>
                                <input type="text" name="vital[respirasi]" class="form-control" value="{$vital.respirasi}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label>Suhu (&deg;C)</label>
                                <input type="text" name="vital[suhu]" class="form-control" value="{$vital.suhu}">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Keadaan Fisik Umum</label>
                        <input type="text" name="pemeriksaan_fisik_umum" class="form-control" value="{$data.pemeriksaan_fisik_umum}">
                    </div>
                </div>
            </div>

            <!-- EKSTRAORAL & INTRAORAL -->
            <div class="row">
                <div class="col-md-6">
                    <div class="panel panel-default">
                        <div class="panel-heading"><h4 class="panel-title">III. Pemeriksaan Ekstraoral</h4></div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label>Pipi / Wajah</label>
                                <input type="text" name="ekstraoral[pipi]" class="form-control" value="{$ekstraoral.pipi}">
                            </div>
                            <div class="form-group">
                                <label>Bibir</label>
                                <input type="text" name="ekstraoral[bibir]" class="form-control" value="{$ekstraoral.bibir}">
                            </div>
                            <div class="form-group">
                                <label>Kelenjar Limfe Submandibula</label>
                                <input type="text" name="ekstraoral[submandibula]" class="form-control" value="{$ekstraoral.submandibula}">
                            </div>
                            <div class="form-group">
                                <label>Sendi Rahang (TMJ)</label>
                                <input type="text" name="ekstraoral[tmj]" class="form-control" value="{$ekstraoral.tmj}">
                            </div>
                            <div class="form-group">
                                <label>Regio Terkena (Diagram Leher/Kepala)</label>
                                <input type="text" name="ekstraoral[regio_terkena]" class="form-control" value="{$ekstraoral.regio_terkena}" placeholder="Contoh: Regio Mandibula Dekstra Posterior">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="panel panel-default">
                        <div class="panel-heading"><h4 class="panel-title">IV. Pemeriksaan Intraoral</h4></div>
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Elemen Gigi</label>
                                        <input type="text" name="intraoral[elemen_gigi]" class="form-control" value="{$intraoral.elemen_gigi}" placeholder="Contoh: 48">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Gingiva</label>
                                        <input type="text" name="intraoral[gingiva]" class="form-control" value="{$intraoral.gingiva}" placeholder="Contoh: Hiperemis pada operkulum 48">
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Inspeksi / Karies</label>
                                        <input type="text" name="intraoral[karies]" class="form-control" value="{$intraoral.karies}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Vitalitas / Tes Termal</label>
                                        <input type="text" name="intraoral[vitalitas]" class="form-control" value="{$intraoral.vitalitas}">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Deskripsi Status Lokalis Gigi</label>
                                <textarea name="status_lokalis_gigi" class="form-control" rows="3">{$data.status_lokalis_gigi}</textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DIAGNOSIS, PENUNJANG, RENCANA -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Pemeriksaan Penunjang (Rontgen / Lab)</label>
                        <textarea name="pemeriksaan_penunjang" class="form-control" rows="2">{$data.pemeriksaan_penunjang}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Diagnosis Utama <span class="text-danger">*</span></label>
                        <input type="text" name="diagnosis_utama" class="form-control" value="{$data.diagnosis_utama}" required placeholder="Contoh: Pericoronitis Gigi 48 ec Impaksi 48">
                    </div>
                    <div class="form-group">
                        <label>Prognosis</label>
                        <input type="text" name="prognosis" class="form-control" value="{$data.prognosis}" placeholder="Contoh: Dubia ad Bonam / Bonam">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label>Rencana Tata Laksana / Tindakan</label>
                        <textarea name="rencana_tata_laksana" class="form-control" rows="3" placeholder="Contoh: Pro Odontektomi Gigi 48...">{$data.rencana_tata_laksana}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Rencana Edukasi &amp; Discharge Planning</label>
                        <textarea name="rencana_edukasi" class="form-control" rows="2">{$data.rencana_edukasi}</textarea>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Nama DPJP Gigi</label>
                        <input type="text" name="nama_dokter" class="form-control" value="{$data.nama_dokter}" placeholder="drg. Tri Nurrahman, Sp.BM">
                    </div>
                </div>
            </div>

            <div class="form-group text-right">
                <a href="{?=url([ADMIN, 'form_rme', 'rimedisgigimanage'])?}" class="btn btn-default"><i class="fa fa-arrow-left"></i> Kembali</a>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Simpan Asesmen Medis Gigi</button>
            </div>
        </form>
    </div>
</div>
