<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-user-md"></i> Form RM.RI 05C - Dokter Penanggung Jawab Pelayanan (DPJP)</h3>
    </div>
    <div class="panel-body">
        <form action="{?=url([ADMIN, 'form_rme', 'ri05csave'])?}" method="POST" id="formDpjp">
            <input type="hidden" name="id" value="{$data.id}">

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. Rawat <span class="text-danger">*</span></label>
                        {if: !empty($data.no_rawat)}
    <input type="text" name="no_rawat" id="no_rawat" class="form-control" value="{$data.no_rawat}" readonly style="background-color: #f8fafc; font-weight: bold; color: #1d4ed8;">
{else}
    <input type="text" name="no_rawat" id="no_rawat" class="form-control" value="{$data.no_rawat}" required placeholder="Contoh: 2022/11/14/000001">
{/if}
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. RM &amp; Nama Pasien</label>
                        <input type="text" id="info_pasien" class="form-control" value="{$data.no_rkm_medis} - {$data.nm_pasien}" readonly>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Diagnosa</label>
                        <input type="text" name="diagnosa" class="form-control" value="{$data.diagnosa}" placeholder="Contoh: Impaksi 48">
                    </div>
                </div>
            </div>

            <!-- DPJP UTAMA & TIM DPJP -->
            <div class="panel panel-primary">
                <div class="panel-heading"><h4 class="panel-title">1. DPJP Utama &amp; Tim DPJP (Dokter Ruangan)</h4></div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>DPJP Utama</label>
                                <input type="text" name="dpjp_utama" class="form-control" value="{$data.dpjp_utama}" placeholder="drg. Tri Nurrahman, Sp.BM">
                            </div>
                        </div>
                    </div>
                    <label>Tim DPJP (Dokter Ruangan):</label>
                    <div class="row">
                        {loop: $tim_dpjp}
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Dokter {?= $key + 1 ?}</label>
                                <div class="row">
                                    <div class="col-md-7">
                                        <input type="text" name="tim_dpjp[{$key}][nama]" class="form-control" value="{$value.nama}" placeholder="Nama dokter ruangan...">
                                    </div>
                                    <div class="col-md-5">
                                        <input type="date" name="tim_dpjp[{$key}][tanggal]" class="form-control" value="{$value.tanggal}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        {/loop}
                    </div>
                </div>
            </div>

            <!-- RAWAT BERSAMA -->
            <div class="panel panel-info">
                <div class="panel-heading"><h4 class="panel-title">2. Rawat Bersama</h4></div>
                <div class="panel-body">
                    {loop: $rawat_bersama}
                    <div class="row" style="margin-bottom: 5px;">
                        <div class="col-md-8">
                            <div class="input-group">
                                <span class="input-group-addon">DPJP {?= $key + 1 ?}</span>
                                <input type="text" name="rawat_bersama[{$key}][nama]" class="form-control" value="{$value.nama}" placeholder="Nama dokter rawat bersama...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-addon">Tanggal</span>
                                <input type="date" name="rawat_bersama[{$key}][tanggal]" class="form-control" value="{$value.tanggal}">
                            </div>
                        </div>
                    </div>
                    {/loop}
                </div>
            </div>

            <!-- PERALIHAN DPJP UTAMA -->
            <div class="panel panel-default">
                <div class="panel-heading"><h4 class="panel-title">3. Peralihan DPJP Utama</h4></div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>DPJP Utama Asal</label>
                                <input type="text" name="peralihan[dpjp_utama]" class="form-control" value="{$peralihan.dpjp_utama}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>DPJP Peralihan (Baru)</label>
                                <input type="text" name="peralihan[dpjp_peralihan]" class="form-control" value="{$peralihan.dpjp_peralihan}">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Tanggal Peralihan</label>
                                <input type="date" name="peralihan[tanggal]" class="form-control" value="{$peralihan.tanggal}">
                            </div>
                        </div>
                        <div class="col-md-8">
                            <div class="form-group">
                                <label>Alasan Peralihan</label>
                                <input type="text" name="peralihan[alasan]" class="form-control" value="{$peralihan.alasan}" placeholder="Alasan peralihan DPJP...">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group text-right">
                <a href="{?=url([ADMIN, 'form_rme', 'ri05cmanage'])?}" class="btn btn-default"><i class="fa fa-arrow-left"></i> Kembali</a>
                <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Simpan Form DPJP</button>
            </div>
        </form>
    </div>
</div>
