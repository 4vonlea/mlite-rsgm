<script>
$('#btn-cari-pasien').click(function(){
    var no_rawat = $('#no_rawat').val();
    if(no_rawat) {
        $.ajax({
            url: '{?=url([ADMIN, 'update_bmt', 'bm4form'])?}',
            type: 'GET',
            data: { ajax_patient: 1, no_rawat: no_rawat },
            success: function(res) {
                if(res.success) {
                    $('#nm_pasien').val(res.nama_pasien);
                } else {
                    alert('Data pasien tidak ditemukan untuk No. Rawat tersebut!');
                }
            }
        });
    }
});

function calculateDuration() {
    var start = $('#waktu_mulai').val();
    var end = $('#waktu_selesai').val();
    
    if(start && end) {
        var startDate = new Date("01/01/2000 " + start);
        var endDate = new Date("01/01/2000 " + end);
        
        if (endDate < startDate) {
            endDate.setDate(endDate.getDate() + 1);
        }
        
        var diff = endDate.getTime() - startDate.getTime();
        var msec = diff;
        var hh = Math.floor(msec / 1000 / 60 / 60);
        msec -= hh * 1000 * 60 * 60;
        var mm = Math.floor(msec / 1000 / 60);
        
        var durationStr = "";
        if (hh > 0) durationStr += hh + " Jam ";
        if (mm > 0) durationStr += mm + " Menit";
        if (durationStr == "") durationStr = "0 Menit";
        
        $('#lama_pembedahan').val(durationStr.trim());
    } else {
        $('#lama_pembedahan').val("");
    }
}

$('#waktu_mulai, #waktu_selesai').on('change', function() {
    calculateDuration();
});
</script>
