<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Data Pemeriksaan Pra Anestesi Lokal</h3>
                <ul class="nav nav-tabs">
                    <li class="active"><a href="{?=url([ADMIN, 'update_bmt', 'bmi4manage'])?}">Data Pemeriksaan</a></li>
                    <li><a href="{?=url([ADMIN, 'update_bmt', 'bmi4form'])?}">Tambah Baru</a></li>
                </ul>
            </div>
            <div class="panel-body">
                <table class="table table-striped table-hover dataTable" id="data-table">
                    <thead>
                        <tr>
                            <th>No Rawat</th>
                            <th>Nama Pasien</th>
                            <th>Tanggal Tindakan</th>
                            <th>Diagnosis</th>
                            <th>Rencana Tindakan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        {loop: $list}
                        <tr>
                            <td>{$value.no_rawat}</td>
                            <td>{$value.nm_pasien}</td>
                            <td>{$value.tanggal_tindakan}</td>
                            <td>{$value.diagnosis}</td>
                            <td>{$value.rencana_tindakan}</td>
                            <td>
                                <a href="{?=url([ADMIN, 'update_bmt', 'bmi4cetak'])?}&id={$value.id}" target="_blank" class="btn btn-xs btn-default"><i class="fa fa-print"></i> Cetak</a>
                                <a href="{?=url([ADMIN, 'update_bmt', 'bmi4form'])?}&id={$value.id}" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i> Edit</a>
                                <a href="{?=url([ADMIN, 'update_bmt', 'bmi4hapus'])?}&id={$value.id}" class="btn btn-xs btn-danger" onclick="return confirm('Yakin ingin menghapus data ini?')"><i class="fa fa-trash"></i> Hapus</a>
                            </td>
                        </tr>
                        {/loop}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</article>

<script>
$(document).ready(function() {
    $('#data-table').DataTable();
});
</script>
