<script>
$('#btn-cari-pasien').click(function(){
    var no_rawat = $('#no_rawat').val();
    if(no_rawat) {
        $.ajax({
            url: '{?=url([ADMIN, 'update_bmt', 'bmi5form'])?}',
            type: 'GET',
            data: { ajax_patient: 1, no_rawat: no_rawat },
            success: function(res) {
                if(res.success) {
                    $('#nm_pasien').val(res.nama_pasien);
                } else {
                    alert('Data pasien tidak ditemukan untuk No. Rawat tersebut!');
                }
            }
        });
    }
});

function hitungLamaPembedahan() {
    var start = $('#waktu_mulai').val();
    var end = $('#waktu_selesai').val();
    if (start && end) {
        var startTime = new Date(start);
        var endTime = new Date(end);
        var diffMs = endTime - startTime;
        if (diffMs > 0) {
            var diffMins = Math.floor(diffMs / 60000);
            var hours = Math.floor(diffMins / 60);
            var mins = diffMins % 60;
            var text = '';
            if (hours > 0) text += hours + ' Jam ';
            text += mins + ' Menit';
            $('#lama_pembedahan').val(text);
        } else {
            $('#lama_pembedahan').val('0 Menit');
        }
    }
}

$('#waktu_mulai, #waktu_selesai').change(hitungLamaPembedahan);

function toggleKet() {
    if ($('input[name="respon_hipersensitivitas"]:checked').val() == 'Tidak') {
        $('.toggle-hipersensitivitas').show();
    } else {
        $('.toggle-hipersensitivitas').hide();
    }
    
    if ($('input[name="kejadian_toksikasi"]:checked').val() == 'Tidak') {
        $('.toggle-toksikasi').show();
    } else {
        $('.toggle-toksikasi').hide();
    }
}
$('input[name="respon_hipersensitivitas"], input[name="kejadian_toksikasi"]').change(toggleKet);
toggleKet();
</script>
