<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Data Lampiran - Asesmen Medis Umum IRNA</h3>
                <ul class="nav nav-tabs">
                    <li class="active"><a href="{?=url([ADMIN, 'update_bmt', 'amumanage'])?}">Kelola Data</a></li>
                    <li><a href="{?=url([ADMIN, 'update_bmt', 'amuform'])?}">Tambah Data</a></li>
                </ul>
            </div>
            <div class="panel-body">
                <div class="table-responsive no-margin">
                    <table class="table table-striped table-bordered no-margin" id="data_table_amu">
                        <thead>
                            <tr>
                                <th>No. RM</th>
                                <th>No. Rawat</th>
                                <th>Nama Pasien</th>
                                <th>Kategori</th>
                                <th>Tgl Masuk</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {loop: $data}
                            <tr>
                                <td>{$value.no_rkm_medis}</td>
                                <td>{$value.no_rawat}</td>
                                <td>{$value.nm_pasien}</td>
                                <td>{$value.kategori_pasien}</td>
                                <td>{$value.tanggal_masuk} {$value.waktu_masuk}</td>
                                <td>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'amuform'])?}&id={$value.id}" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i> Edit</a>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'amuhapus'])?}&id={$value.id}" class="btn btn-xs btn-danger" onclick="return confirm('Hapus data?');"><i class="fa fa-trash"></i> Hapus</a>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'amucetak'])?}&id={$value.id}" target="_blank" class="btn btn-xs btn-success"><i class="fa fa-print"></i> Cetak</a>
                                </td>
                            </tr>
                            {/loop}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</article>
<script>
    $('#data_table_amu').DataTable({ order: [] });
</script>
