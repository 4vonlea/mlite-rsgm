<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Kelola RM.RI 15A - Daftar Instruksi Medis Farmakologi</h3>
                <ul class="nav nav-tabs">
                    <li class="active"><a href="{?=url([ADMIN, 'update_bmt', 'ri15amanage'])?}">Kelola Data</a></li>
                    <li><a href="{?=url([ADMIN, 'update_bmt', 'ri15aform'])?}">Tambah Data</a></li>
                </ul>
            </div>
            <div class="panel-body">
                <div class="table-responsive no-margin">
                    <table class="table table-striped table-bordered no-margin" id="myTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>No Rawat</th>
                                <th>No RM</th>
                                <th>Nama Pasien</th>
                                <th>Riwayat Alergi</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            {loop: $data}
                            <tr>
                                <td>{$value.id}</td>
                                <td>{$value.no_rawat}</td>
                                <td>{$value.no_rkm_medis}</td>
                                <td>{$value.nm_pasien}</td>
                                <td>{$value.riwayat_alergi}</td>
                                <td>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'ri15acetak', '?id='.$value.id])?}" class="btn btn-xs btn-success" target="_blank"><i class="fa fa-print"></i> Cetak</a>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'ri15aform', '?id='.$value.id])?}" class="btn btn-xs btn-primary"><i class="fa fa-edit"></i> Edit</a>
                                    <a href="{?=url([ADMIN, 'update_bmt', 'ri15ahapus', '?id='.$value.id])?}" class="btn btn-xs btn-danger" onclick="return confirm('Hapus data ini?');"><i class="fa fa-trash"></i> Hapus</a>
                                </td>
                            </tr>
                            {/loop}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</article>
<script>
    $(document).ready(function() { $('#myTable').DataTable(); });
</script>
