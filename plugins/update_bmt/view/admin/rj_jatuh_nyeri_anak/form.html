<div class="panel panel-default">
    <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-child"></i> Form Asesmen Risiko Jatuh dan Nyeri Pasien Anak</h3>
    </div>
    <div class="panel-body">
        <form action="{?=url([ADMIN, 'update_bmt', 'jatuhanaksave'])?}" method="POST" id="formJatuhAnak">
            <input type="hidden" name="id" value="{$data.id}">

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. Rawat <span class="text-danger">*</span></label>
                        <input type="text" name="no_rawat" id="no_rawat" class="form-control" value="{$data.no_rawat}" required placeholder="Contoh: 2025/08/13/000040">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>No. RM &amp; Nama Pasien</label>
                        <input type="text" id="info_pasien" class="form-control" value="{$data.no_rkm_medis} - {$data.nm_pasien}" readonly>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" name="tanggal" class="form-control" value="{$data.tanggal}">
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="form-group">
                        <label>Jam</label>
                        <input type="time" name="jam" class="form-control" value="{$data.jam}">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Instalasi / Unit / Ruangan</label>
                        <input type="text" name="instalasi_unit" class="form-control" value="{$data.instalasi_unit}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label>Petugas Pengkaji</label>
                        <input type="text" name="petugas_nama" class="form-control" value="{$data.petugas_nama}" placeholder="Nama perawat / petugas...">
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- HUMPTY DUMPTY -->
                <div class="col-md-6">
                    <div class="panel panel-primary">
                        <div class="panel-heading"><h4 class="panel-title">1. Humpty Dumpty Falls Scale (0-17 Tahun)</h4></div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label>Umur</label>
                                <select name="hd[umur]" class="form-control calc-hd">
                                    <option value="4" {if: $hd.umur == 4}selected{/if}>Kurang dari 3 tahun (Skor 4)</option>
                                    <option value="3" {if: $hd.umur == 3}selected{/if}>3 tahun - 7 tahun (Skor 3)</option>
                                    <option value="2" {if: $hd.umur == 2}selected{/if}>7 tahun - 13 tahun (Skor 2)</option>
                                    <option value="1" {if: $hd.umur == 1}selected{/if}>Lebih 13 tahun (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Jenis Kelamin</label>
                                <select name="hd[jenis_kelamin]" class="form-control calc-hd">
                                    <option value="2" {if: $hd.jenis_kelamin == 2}selected{/if}>Laki-laki (Skor 2)</option>
                                    <option value="1" {if: $hd.jenis_kelamin == 1}selected{/if}>Wanita (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Diagnosa</label>
                                <select name="hd[diagnosa]" class="form-control calc-hd">
                                    <option value="4" {if: $hd.diagnosa == 4}selected{/if}>Neurologi (Skor 4)</option>
                                    <option value="3" {if: $hd.diagnosa == 3}selected{/if}>Respiratori, dehidrasi, anemia, anoreksia, syncope (Skor 3)</option>
                                    <option value="2" {if: $hd.diagnosa == 2}selected{/if}>Perilaku (Skor 2)</option>
                                    <option value="1" {if: $hd.diagnosa == 1}selected{/if}>Lain-lain (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Gangguan Kognitif</label>
                                <select name="hd[kognitif]" class="form-control calc-hd">
                                    <option value="3" {if: $hd.kognitif == 3}selected{/if}>Keterbatasan daya pikir (Skor 3)</option>
                                    <option value="2" {if: $hd.kognitif == 2}selected{/if}>Pelupa, berkurangnya orientasi sekitar (Skor 2)</option>
                                    <option value="1" {if: $hd.kognitif == 1}selected{/if}>Dapat menggunakan daya pikir tanpa hambatan (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Faktor Lingkungan</label>
                                <select name="hd[lingkungan]" class="form-control calc-hd">
                                    <option value="4" {if: $hd.lingkungan == 4}selected{/if}>Riwayat jatuh / balita di tempat tidur (Skor 4)</option>
                                    <option value="3" {if: $hd.lingkungan == 3}selected{/if}>Menggunakan alat bantu / bayi dlm ayunan (Skor 3)</option>
                                    <option value="2" {if: $hd.lingkungan == 2}selected{/if}>Pasien di tempat tidur standar (Skor 2)</option>
                                    <option value="1" {if: $hd.lingkungan == 1}selected{/if}>Area pasien rawat jalan (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Respon terhadap pembedahan, sedasi, anestesi</label>
                                <select name="hd[respon_bedah]" class="form-control calc-hd">
                                    <option value="3" {if: $hd.respon_bedah == 3}selected{/if}>Dalam 24 jam (Skor 3)</option>
                                    <option value="2" {if: $hd.respon_bedah == 2}selected{/if}>Dalam 48 jam (Skor 2)</option>
                                    <option value="1" {if: $hd.respon_bedah == 1}selected{/if}>Lebih dari 48 jam / tidak ada respon (Skor 1)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Penggunaan Obat-obatan</label>
                                <select name="hd[obat]" class="form-control calc-hd">
                                    <option value="3" {if: $hd.obat == 3}selected{/if}>Sedative, barbiturate, anti depresan, diuretik, narkotik (Skor 3)</option>
                                    <option value="2" {if: $hd.obat == 2}selected{/if}>Salah satu dari obat di atas (Skor 2)</option>
                                    <option value="1" {if: $hd.obat == 1}selected{/if}>Obat lainnya / tanpa obat (Skor 1)</option>
                                </select>
                            </div>
                            <div class="well well-sm">
                                <strong>Total Skor Humpty Dumpty:</strong> <span id="hd_total_display" class="badge">{$data.humpty_dumpty_total}</span>
                                <input type="hidden" name="humpty_dumpty_total" id="hd_total" value="{$data.humpty_dumpty_total}">
                                <input type="hidden" name="humpty_dumpty_kategori" id="hd_kategori" value="{$data.humpty_dumpty_kategori}">
                                <div id="hd_kategori_display" style="margin-top: 5px; font-weight: bold;">{$data.humpty_dumpty_kategori}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FLACC PAIN SCALE -->
                <div class="col-md-6">
                    <div class="panel panel-info">
                        <div class="panel-heading"><h4 class="panel-title">2. FLACC Pain Scale (<6 Tahun)</h4></div>
                        <div class="panel-body">
                            <div class="form-group">
                                <label>1. Face (Wajah)</label>
                                <select name="flacc[face]" class="form-control calc-flacc">
                                    <option value="0" {if: $flacc.face == 0}selected{/if}>0 - Rileks, tersenyum, tidak ada ekspresi khusus</option>
                                    <option value="1" {if: $flacc.face == 1}selected{/if}>1 - Menyeringai, mengerutkan dahi, kadang-kadang murung</option>
                                    <option value="2" {if: $flacc.face == 2}selected{/if}>2 - Dagu gemetar, gigi gemertak secara konstan / sering</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>2. Leg (Kaki)</label>
                                <select name="flacc[leg]" class="form-control calc-flacc">
                                    <option value="0" {if: $flacc.leg == 0}selected{/if}>0 - Normal, santai, posisi rileks</option>
                                    <option value="1" {if: $flacc.leg == 1}selected{/if}>1 - Gelisah, tegang, kaku</option>
                                    <option value="2" {if: $flacc.leg == 2}selected{/if}>2 - Menendang, kaki terangkat/ditekuk ke atas</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>3. Activity (Aktivitas)</label>
                                <select name="flacc[activity]" class="form-control calc-flacc">
                                    <option value="0" {if: $flacc.activity == 0}selected{/if}>0 - Berbaring tenang, posisi normal, gerakan mudah</option>
                                    <option value="1" {if: $flacc.activity == 1}selected{/if}>1 - Menggeliat, berpindah-pindah, tegang</option>
                                    <option value="2" {if: $flacc.activity == 2}selected{/if}>2 - Kaku melengkung, menyentak-nyentak, kejang</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>4. Cry (Menangis)</label>
                                <select name="flacc[cry]" class="form-control calc-flacc">
                                    <option value="0" {if: $flacc.cry == 0}selected{/if}>0 - Tidak menangis (terjaga atau tidur)</option>
                                    <option value="1" {if: $flacc.cry == 1}selected{/if}>1 - Mengerang, merengek, kadang menangis</option>
                                    <option value="2" {if: $flacc.cry == 2}selected{/if}>2 - Menangis keras terus-menerus, menjerit, histeris</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>5. Consolability (Konsabilitas)</label>
                                <select name="flacc[consolability]" class="form-control calc-flacc">
                                    <option value="0" {if: $flacc.consolability == 0}selected{/if}>0 - Puas, tenang, rileks</option>
                                    <option value="1" {if: $flacc.consolability == 1}selected{/if}>1 - Tenang dengan sentuhan, pelukan, diajak bicara</option>
                                    <option value="2" {if: $flacc.consolability == 2}selected{/if}>2 - Sulit ditenangkan atau dibujuk</option>
                                </select>
                            </div>
                            <div class="well well-sm">
                                <strong>Total Skor FLACC:</strong> <span id="flacc_total_display" class="badge">{$data.flacc_total}</span>
                                <input type="hidden" name="flacc_total" id="flacc_total" value="{$data.flacc_total}">
                                <input type="hidden" name="flacc_kategori" id="flacc_kategori" value="{$data.flacc_kategori}">
                                <div id="flacc_kategori_display" style="margin-top: 5px; font-weight: bold;">{$data.flacc_kategori}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group text-right">
                <a href="{?=url([ADMIN, 'update_bmt', 'jatuhanakmanage'])?}" class="btn btn-default"><i class="fa fa-arrow-left"></i> Kembali</a>
                <button type="submit" class="btn btn-success"><i class="fa fa-save"></i> Simpan Asesmen Anak</button>
            </div>
        </form>
    </div>
</div>

<script>
$(document).ready(function() {
    function hitungHD() {
        var tot = 0;
        $('.calc-hd').each(function() {
            tot += parseInt($(this).val()) || 0;
        });
        $('#hd_total_display').text(tot);
        $('#hd_total').val(tot);
        var kat = (tot >= 12) ? 'Risiko Tinggi (RT)' : 'Risiko Rendah (RR)';
        $('#hd_kategori').val(kat);
        $('#hd_kategori_display').html('<span class="label ' + (tot >= 12 ? 'label-danger' : 'label-success') + '">' + kat + '</span>');
    }

    function hitungFLACC() {
        var tot = 0;
        $('.calc-flacc').each(function() {
            tot += parseInt($(this).val()) || 0;
        });
        $('#flacc_total_display').text(tot);
        $('#flacc_total').val(tot);
        var kat = 'Tidak Nyeri';
        if (tot >= 7) kat = 'Nyeri Berat (Skor 7-10)';
        else if (tot >= 4) kat = 'Nyeri Sedang (Skor 4-6)';
        else if (tot >= 1) kat = 'Nyeri Ringan (Skor 1-3)';
        $('#flacc_kategori').val(kat);
        $('#flacc_kategori_display').html('<span class="label label-info">' + kat + '</span>');
    }

    $('.calc-hd').change(hitungHD);
    $('.calc-flacc').change(hitungFLACC);
});
</script>
