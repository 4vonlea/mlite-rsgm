<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">Form Hak dan Kewajiban Pasien (RM.RI 01B)</h3>
                <ul class="nav nav-tabs">
                    <li><a href="{?=url([ADMIN, 'update_bmt', 'ri01bmanage'])?}">Kelola Data</a></li>
                    <li class="active"><a href="{?=url([ADMIN, 'update_bmt', 'ri01bform'])?}">Form Data</a></li>
                </ul>
            </div>
            <div class="panel-body">
                <form action="{?=url([ADMIN, 'update_bmt', 'ri01bsave'])?}" method="post">
                    <input type="hidden" name="id" value="{$data.id}">
                    <div class="form-group">
                        <label>No. Rawat</label>
                        <div class="input-group">
                            <input type="text" class="form-control" name="no_rawat" id="no_rawat" value="{$data.no_rawat}" required>
                            <span class="input-group-btn">
                                <button class="btn btn-primary" type="button" id="btn_cek_pasien">Cek Pasien</button>
                            </span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>No RM</label>
                                <input type="text" class="form-control" id="no_rkm_medis" value="{$data.no_rkm_medis}" readonly>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Nama Pasien</label>
                                <input type="text" class="form-control" id="nm_pasien" value="{$data.nm_pasien}" readonly>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label>Tanggal Lahir</label>
                                <input type="text" class="form-control" id="tgl_lahir" value="{$data.tgl_lahir}" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Nama Pasien/Penanggung Jawab (Tanda Tangan)</label>
                                <input type="text" class="form-control" name="nama_pasien_pj" value="{$data.nama_pasien_pj}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Nama Pemberi Edukasi (Tanda Tangan)</label>
                                <select class="form-control f-nama_pemberi_edukasi" name="nama_pemberi_edukasi" style="width:100%"></select>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="{?=url([ADMIN, 'update_bmt', 'ri01bmanage'])?}" class="btn btn-default">Kembali</a>
                </form>
            </div>
        </div>
    </div>
</article>

<link href="{?=url()?}/assets/css/select2.min.css" rel="stylesheet" />
<script src="{?=url()?}/assets/jscripts/select2.min.js"></script>
<script>
    $(document).ready(function() {
        $('.f-nama_pemberi_edukasi').select2({
            ajax: {
                url: "{?=url([ADMIN, 'update_bmt', 'ri01bform'])?}?ajax_pegawai=1",
                dataType: 'json', delay: 250,
                processResults: function (data) { return { results: data.results }; },
                cache: true
            },
            placeholder: 'Pilih Petugas...',
            minimumInputLength: 1,
            tags: true,
            width: '100%'
        });
        
        var curPemberi = '{$data.nama_pemberi_edukasi}';
        if(curPemberi) {
            $('.f-nama_pemberi_edukasi').append(new Option(curPemberi, curPemberi, true, true)).trigger('change');
        }
    });

    function cekPasien() {
        var no_rawat = $('#no_rawat').val();
        if (no_rawat) {
            $.ajax({
                url: '{?=url([ADMIN, "update_bmt", "ri01bform"])?}',
                type: 'GET',
                data: {
                    ajax_patient: 1,
                    no_rawat: no_rawat,
                    t: '{?=$_SESSION["token"]?}'
                },
                dataType: 'json',
                success: function(res) {
                    if (res.success) {
                        $('#no_rawat').val(res.no_rawat);
                        $('#no_rkm_medis').val(res.no_rkm_medis);
                        $('#nm_pasien').val(res.nm_pasien);
                        $('#tgl_lahir').val(res.tgl_lahir);
                        
                        if(!$('input[name="nama_pasien_pj"]').val()) {
                            $('input[name="nama_pasien_pj"]').val(res.nm_pasien);
                        }
                    } else {
                        alert('Pasien tidak ditemukan!');
                    }
                },
                error: function() {
                    alert('Terjadi kesalahan saat mencari data pasien.');
                }
            });
        }
    }

    $('#btn_cek_pasien').click(cekPasien);
    $('#no_rawat').on('keypress', function(e) {
        if(e.which === 13) {
            e.preventDefault();
            cekPasien();
        }
    });
</script>
