<style>
/* ==========================================================================
   RSGM LUXURY CLINICAL — APOTEK RAWAT JALAN WORKSPACE & VALIDATION UI
   ========================================================================== */
#manage .rsgm-apt-title-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  height: 28px;
  border-radius: 7px !important;
  background: #eff6ff;
  border: 1px solid #bfdbfe;

  font-size: 13px;
}

/* Pastikan Selectator di form racikan & autocomplete aturan pakai tidak terpotong */
#form_rincian .rsgm-reg-shell,
#form_rincian .rsgm-reg-grid,
#form_rincian .rsgm-reg-col,
#form_rincian .rsgm-reg-body,
#form_rincian .rsgm-rincian-subbox {

}

}

}
#form_rincian .selectator_options {
  z-index: 1060 !important;

}

}
#form_rincian #aturan_pakaiList .list-group-item {
  cursor: pointer;
  padding: 7px 12px;
  font-size: 12.5px;
  border-color: #e2e8f0;
}
#form_rincian #aturan_pakaiList .list-group-item:hover {
  background-color: #eff6ff;
  color: #1d4ed8;
}

/* Rincian Workspace Spacing */
.rsgm-apt-wrap {
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Skrining Resep & Informasi Klinis Pasien */
.rsgm-apt-screen-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 991px) {
  .rsgm-apt-screen-grid {
    grid-template-columns: 1fr;
  }
}
.rsgm-apt-screen-col {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 9px !important;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
}
.rsgm-apt-screen-col-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;

  padding-bottom: 8px;

}
.rsgm-apt-screen-col-title i {
  color: #2563eb;
}
.rsgm-apt-kv {
  width: 100%;

}
.rsgm-apt-kv td {
  padding: 3.5px 0;
  vertical-align: top;
}
.rsgm-apt-kv td.kv-label {
  width: 108px;
  color: #64748b;
  font-weight: 500;
  padding-right: 8px;
  white-space: nowrap;
}
.rsgm-apt-kv td.kv-val {
  color: #0f172a;
}
.rsgm-apt-diag-list {
  list-style: none;

  max-height: 118px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rsgm-apt-diag-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 12px;
  color: #1e293b;
  line-height: 1.35;
}
.rsgm-apt-alergi-pill {
  display: inline-flex;
  align-items: center;

  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.35;
}
.rsgm-apt-alergi-safe {

}
.rsgm-apt-alergi-danger {

/* Riwayat Pengobatan Collapsible */
.rsgm-apt-riwayat-wrap {

  border-radius: 9px !important;

  background: #ffffff;
}
.rsgm-apt-riwayat-toggle {
  display: flex !important;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  background: #f8fafc;

  font-size: 12.5px;

}
.rsgm-apt-riwayat-toggle:hover {
  background: #f1f5f9;

}
.rsgm-apt-riwayat-body {
  max-height: 260px;
  overflow-y: auto;
  padding: 10px 12px;
  border-top: 1px solid #e2e8f0;
}

/* Section Divider Header */
.rsgm-apt-section-head {

  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: -6px;
}
.rsgm-apt-section-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #0f172a;
  text-transform: uppercase;
  letter-spacing: 0.45px;
}
.rsgm-apt-section-label .apt-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2563eb;

}
.rsgm-apt-section-label .apt-dot.dot-emerald {

}

/* e-Resep Group Bar inside tbody.resep-group */
.rsgm-apt-resep-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.rsgm-apt-resep-meta {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.rsgm-apt-resep-meta-top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
}
.rsgm-apt-resep-doc {

  color: #0f172a;

}
.rsgm-apt-resep-time {

}
.rsgm-apt-audit-row {

  flex-wrap: wrap;
  gap: 6px;
}
.rsgm-apt-audit-chip {

}
.rsgm-apt-audit-chip.chip-valid {
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
}
.rsgm-apt-audit-chip.chip-serah {

  color: #1e40af;

}
.rsgm-apt-resep-actions {
  display: flex;

  flex-wrap: wrap;
  gap: 5px;
}
.rsgm-apt-resep-actions .btn {
  border-radius: 6px !important;
  padding: 4px 10px !important;
  font-size: 11.5px !important;
  font-weight: 600 !important;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}

/* Inline Inputs in e-Resep Tables */
.rsgm-apt-input {
  height: 30px !important;
  padding: 3px 8px !important;
  font-size: 12px !important;
  border-radius: 6px !important;
  border: 1px solid #cbd5e1 !important;
  color: #0f172a !important;
  background-color: #ffffff !important;
  box-shadow: none !important;
  font-variant-numeric: tabular-nums;
}
.rsgm-apt-input:focus {
  border-color: #2563eb !important;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12) !important;
}
.rsgm-apt-input[disabled] {
  background-color: #f8fafc !important;
  border-color: #e2e8f0 !important;
  color: #475569 !important;
  cursor: not-allowed;
}
.rsgm-apt-input-num {
  width: 78px !important;
  text-align: right;
}
.rsgm-apt-input-fee {
  width: 84px !important;
  text-align: right;
}
.rsgm-apt-aturan-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
}
.rsgm-apt-aturan-wrap .rsgm-apt-input {
  flex: 1 1 auto;
  min-width: 155px;
}
.rsgm-apt-btn-print {
  background: #fff1f2 !important;
  border: 1px solid #fecdd3 !important;
  color: #be123c !important;
  border-radius: 6px !important;
  padding: 4px 8px !important;
  font-size: 11.5px !important;
  flex-shrink: 0;
  transition: all 0.14s ease;
}
.rsgm-apt-btn-print:hover {
  background: #e11d48 !important;
  border-color: #be123c !important;
  color: #ffffff !important;
}
.rsgm-apt-stok-meta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 3px;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 4px !important;
}
.rsgm-apt-stok-ok {
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
}
.rsgm-apt-stok-low {
  background: #fff1f2;
  color: #be123c;
  border: 1px solid #fecdd3;
}
.rsgm-apt-price {
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: #0f172a;
}
.rsgm-apt-racik-summary > td {
  background-color: #faf5ff !important;
}

/* Modern Clinical Modals (Validasi, Penyerahan, Tambah Item, Cetak) */
.rsgm-apt-modal .modal-content {
  border: 1px solid #dbe3ec !important;
  border-radius: 14px !important;
  overflow: hidden;
  box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.25) !important;
}
.rsgm-apt-modal .modal-header {
  padding: 15px 20px !important;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #e2e8f0 !important;
}
.rsgm-apt-modal .modal-header::before,
.rsgm-apt-modal .modal-header::after {
  display: none !important;
}
.rsgm-apt-modal .modal-header.hdr-validasi {
  background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%) !important;
  border-bottom-color: #a7f3d0 !important;
}
.rsgm-apt-modal .modal-header.hdr-penyerahan {
  background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%) !important;
  border-bottom-color: #bfdbfe !important;
}
.rsgm-apt-modal .modal-header.hdr-barang {
  background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%) !important;
  border-bottom-color: #c7d2fe !important;
}
.rsgm-apt-modal-head-left {
  display: flex;
  align-items: center;
  gap: 11px;
}
.rsgm-apt-modal-ico {
  width: 38px;
  height: 38px;
  border-radius: 10px !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.rsgm-apt-modal-ico.ico-validasi {
  background: #059669;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
}
.rsgm-apt-modal-ico.ico-penyerahan {
  background: #2563eb;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
}
.rsgm-apt-modal-ico.ico-barang {
  background: #4f46e5;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
}
.rsgm-apt-modal-title {
  margin: 0 !important;
  font-size: 15.5px !important;
  font-weight: 700 !important;
  color: #0f172a !important;
  line-height: 1.25;
}
.rsgm-apt-modal-sub {
  display: block;
  font-size: 11.5px;
  color: #475569;
  margin-top: 2px;
}
.rsgm-apt-modal .modal-body {
  padding: 18px 20px !important;
  background: #f8fafc;
}
.rsgm-apt-modal-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 14px;
  margin-bottom: 14px;
}
@media (max-width: 767px) {
  .rsgm-apt-modal-grid {
    grid-template-columns: 1fr;
  }
}
.rsgm-apt-modal-box {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px !important;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.rsgm-apt-modal-box-head {
  padding: 9px 14px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  font-size: 12px;
  font-weight: 700;
  color: #1e293b;
  display: flex;
  align-items: center;
  gap: 7px;
}
.rsgm-apt-modal-box-body {
  padding: 11px 14px;
  flex: 1;
}
.rsgm-apt-check-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}
@media (max-width: 767px) {
  .rsgm-apt-check-grid {
    grid-template-columns: 1fr;
  }
}
.rsgm-apt-check-item {
  display: flex !important;
  align-items: flex-start;
  gap: 9px;
  margin: 0 !important;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #dbe3ec;
  border-radius: 8px !important;
  font-size: 12.5px;
  font-weight: 500 !important;
  color: #1e293b;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.15s ease;
}
.rsgm-apt-check-item:hover {
  border-color: #94a3b8;
  background: #ffffff;
}
.rsgm-apt-check-item input[type="checkbox"] {
  margin: 2px 0 0 0 !important;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: #059669;
}
.rsgm-apt-check-item.is-checked-valid {
  background: #ecfdf5;
  border-color: #6ee7b7;
  color: #065f46;
}
.rsgm-apt-check-item.is-checked-serah {
  background: #eff6ff;
  border-color: #93c5fd;
  color: #1e40af;
}
.rsgm-apt-check-item.is-checked-serah input[type="checkbox"] {
  accent-color: #2563eb;
}
.rsgm-apt-modal .modal-footer {
  padding: 12px 20px !important;
  background: #ffffff;
  border-top: 1px solid #e2e8f0 !important;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.rsgm-apt-modal .modal-footer::before,
.rsgm-apt-modal .modal-footer::after {
  display: none !important;
}
.rsgm-apt-petugas-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px !important;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  font-size: 12px;
  color: #475569;
}
.rsgm-apt-petugas-pill strong {
  color: #0f172a;
}
.rsgm-apt-modal-footer-btns {
  display: flex;
  align-items: center;
  gap: 8px;
}
.rsgm-apt-modal-footer-btns .btn {
  border-radius: 8px !important;
  padding: 7px 15px !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
}
</style>
<div class="row" id="manage" style="margin-bottom:100px;">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading rsgm-panel-head">
        <h3 class="panel-title">
          <span class="rsgm-apt-title-ico"><i class="fa fa-medkit"></i></span>
          <span>Apotek Rawat Jalan</span>
        </h3>
        <div class="rsgm-filter-bar">
          <div class="rsgm-date-range">
            <i class="fa fa-calendar rsgm-date-ico"></i>
            <input type="text" id="periode_rawat_jalan" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan" required>
            <span class="rsgm-date-sep">&ndash;</span>
            <input type="text" id="periode_rawat_jalan_akhir" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan_akhir" required>
          </div>
          <div class="rsgm-filter-pills">
            <button type="button" id="submit_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-all">Semua</button>
            <button type="button" id="belum_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-pending">Belum Diperiksa</button>
            <button type="button" id="selesai_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-done">Selesai Diperiksa</button>
            <button type="button" id="lunas_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-paid">Sudah Bayar</button>
          </div>
          <button type="button" id="btn_suara_order_apotek" class="btn btn-sm btn-default" title="Aktifkan / matikan notifikasi suara saat ada order apotek baru"><i class="fa fa-volume-up"></i> Suara: Aktif</button>
          <div class="rsgm-mode-switch">
            <a href="{?=url([ADMIN,'apotek_ralan','manage'])?}" class="active"><i class="fa fa-wheelchair"></i> Apotek Ralan</a>
            <a href="{?=url([ADMIN,'apotek_ranap','manage'])?}"><i class="fa fa-hotel"></i> Apotek Ranap</a>
          </div>
        </div>
      </div>
      <div class="panel-body">
        <div class="row">
          <div id="notif"></div>
        </div>
        <div id="apotek_ralan" class="display">
          {include: ../plugins/apotek_ralan/view/admin/display.html}
        </div>
        <div class="row">
          {include: ../plugins/apotek_ralan/view/admin/form.rincian.html}
        </div>
        <div>
          <div id="rincian"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
   $(function () {
       $('.periode_rawat_jalan').datetimepicker({
         defaultDate: '{?=date('Y-m-d')?}',
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
       
       $('#periode_rawat_jalan').on('dp.change', function(e) {
           $('#periode_rawat_jalan_akhir').data('DateTimePicker').date(e.date);
       });
   });
</script>
