<div id="form_rincian" class="rsgm-reg-form clearfix">
  <div class="col-md-12">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-grid">
        <div class="rsgm-reg-col rsgm-reg-col-main">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-medkit"></i></span>
              <span>Input Pemberian Obat &amp; Racikan</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Dispensing Farmasi</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label for="tgl_perawatan" class="col-sm-3 control-label">Tanggal</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-calendar rsgm-field-icon"></i>
                    <input type="text" id="tgl_perawatan" name="tgl_perawatan" class="form-control tanggal" value="{?=date('Y-m-d')?}">
                  </div>
                </div>
                <label for="jam_rawat" class="col-sm-2 control-label rsgm-label-inline">Jam</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-clock-o rsgm-field-icon"></i>
                    <input type="text" id="jam_rawat" name="jam_rawat" class="form-control jam" value="{?=date('H:i:s')?}">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="apt_no_rawat" class="col-sm-3 control-label">Id Rawat</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-hashtag rsgm-field-icon"></i>
                    <input type="text" id="apt_no_rawat" name="no_rawat" placeholder="ID Rawat Jalan" class="form-control" value="" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Obat Non-Racik</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-search rsgm-field-icon"></i>
                    <input type="text" name="obat" class="form-control" placeholder="Ketik nama obat / BHP untuk mencari..." value="" autocomplete="off">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Metode Racikan</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-flask rsgm-field-icon"></i>
                    <input type="text" name="racikan" class="form-control" placeholder="Ketik nama metode racikan (mis: Puyer, Kapsul)..." value="" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="rsgm-reg-col rsgm-reg-col-side rsgm-reg-col-editable">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-id-card-o"></i></span>
              <span>Identitas Pasien &amp; Item Terpilih</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Detail Input</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-3 control-label">Nomor RM</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-address-card-o rsgm-field-icon"></i>
                    <input type="text" name="no_rkm_medis" class="form-control" placeholder="Nomor Rekam Medik" value="" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Nama Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-user-o rsgm-field-icon"></i>
                    <input type="text" name="nm_pasien" class="form-control" placeholder="Nama pasien" value="" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Jenis Item</label>
                <div class="col-sm-5">
                  <input type="hidden" name="kd_jenis_prw" class="form-control" value="">
                  <input type="text" name="nm_perawatan" class="form-control" placeholder="Pilih obat / racikan di kiri..." value="" readonly style="background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1e40af !important; font-weight: 600;">
                  <input type="hidden" name="kat" class="form-control" value="">
                </div>
                <label for="biaya" class="col-sm-1 control-label rsgm-label-inline">Biaya</label>
                <div class="col-sm-3">
                  <input type="text" id="biaya" name="biaya" class="form-control text-right" placeholder="Rp 0" value="" readonly style="font-variant-numeric: tabular-nums;">
                </div>
              </div>

              <div id="daftar_racikan" class="rsgm-rincian-subbox">
                <div class="form-group">
                  <label for="nama_racik" class="col-sm-3 control-label">Nama Racikan</label>
                  <div class="col-sm-9">
                    <input type="text" id="nama_racik" name="nama_racik" class="form-control" placeholder="Contoh: Puyer Demam Anak" value="">
                  </div>
                </div>
                <div id="item_racikan">
                  <div class="form-group">
                    <label class="col-sm-3 control-label">
                      <button type="button" class="btn btn-xs btn-primary add_racikan" title="Tambah komposisi obat"><span class="fa fa-plus"></span></button> Obat
                    </label>
                    <div class="col-sm-6">
                      <select name="kode_brng" id="kode_brng" class="form-control databarang_ajax">
                      </select>
                    </div>
                    <label class="col-sm-1 control-label rsgm-label-inline">Knd.</label>
                    <div class="col-sm-2">
                      <input type="text" name="kandungan" class="form-control text-center" placeholder="0" value="" />
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="keterangan" class="col-sm-3 control-label">Keterangan</label>
                  <div class="col-sm-9">
                    <textarea name="keterangan" id="keterangan" rows="2" class="form-control" placeholder="Catatan pembuatan racikan..."></textarea>
                  </div>
                </div>
              </div>

              <div id="aturan_pakai" class="rsgm-rincian-subbox">
                <div class="form-group">
                  <label class="col-sm-3 control-label">Embalase</label>
                  <div class="col-sm-3">
                    <input type="text" name="embalase" class="form-control text-right" value="" placeholder="{?=($this->core->settings->get('farmasi.embalase') !== '' ? $this->core->settings->get('farmasi.embalase') : '0')?}" style="font-variant-numeric: tabular-nums;">
                  </div>
                  <label class="col-sm-2 control-label rsgm-label-inline">Tuslah</label>
                  <div class="col-sm-4">
                    <input type="text" name="tuslah" class="form-control text-right" value="" placeholder="{?=($this->core->settings->get('farmasi.tuslah') !== '' ? $this->core->settings->get('farmasi.tuslah') : '0')?}" style="font-variant-numeric: tabular-nums;">
                  </div>
                </div>
                <div class="form-group">
                  <label for="aturan_pakai_input" class="col-sm-3 control-label">Aturan Pakai</label>
                  <div class="col-sm-6" style="position: relative;">
                    <input type="text" class="form-control" name="aturan_pakai" id="aturan_pakai_input" placeholder="Cth: 3 x 1 sehari sesudah makan" value="" autocomplete="off">
                    <ul class="list-group" id="aturan_pakaiList"></ul>
                  </div>
                  <label for="jml" class="col-sm-1 control-label rsgm-label-inline">Jml</label>
                  <div class="col-sm-2">
                    <input type="text" name="jml" id="jml" class="form-control text-center" value="10" style="font-variant-numeric: tabular-nums;">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="layanan" class="rsgm-pasien-drawer"></div>
      <div id="obat" class="rsgm-pasien-drawer"></div>
      <div id="racikan" class="rsgm-pasien-drawer"></div>

      <div class="rsgm-reg-footer">
        <span class="rsgm-footer-hint hidden-xs">
          <i class="fa fa-info-circle"></i> Untuk input langsung, cari obat/racikan di kiri lalu klik <strong>Masukkan Rincian</strong> &mdash; atau langsung validasi e-Resep di bawah.
        </span>
        <div class="rsgm-reg-actions">
          <button type="button" name="button" class="btn btn-primary" id="simpan_rincian"{if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_create', 'apotek_ralan') == false} disabled{/if}><i class="fa fa-save"></i><span class="hidden-xs"> Masukkan Rincian</span></button>
          <button type="button" name="button" class="btn btn-success" id="selesai"><i class="fa fa-arrow-left"></i><span class="hidden-xs"> Selesai / Kembali</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  $(document).on("click", "#form_rincian .rsgm-pasien-close", function(e) {
    e.preventDefault();
    $('#layanan, #obat, #racikan').hide();
  });

  $('input:text[name=obat]').on('input', function() {
    if ($(this).val() === '') $('#obat').hide();
  });
  $('input:text[name=racikan]').on('input', function() {
    if ($(this).val() === '') $('#racikan').hide();
  });

  $('input:text[name=aturan_pakai]').on('input',function(e){
    var baseURL = mlite.url + '/' + mlite.admin;
    var url    = baseURL + '/apotek_ralan/aturanpakai?t=' + mlite.token;
    var query = $('input:text[name=aturan_pakai]').val();
    if(query!="") {
        $.ajax({
             url: url,
             method:"POST",
             data:{query:query},
             success:function(data)
             {
                  $('#aturan_pakaiList').fadeIn();
                  $('#aturan_pakaiList').html(data);
             }
        });
    } else {
        $('#aturan_pakaiList').fadeOut();
    }
  });

  $('#aturan_pakaiList').on('click', 'li', function(){
       $('input:text[name=aturan_pakai]').val($(this).text());
       $('#aturan_pakaiList').fadeOut();
  });

  $(document).on('click', function(e) {
       if (!$(e.target).closest('input[name=aturan_pakai], #aturan_pakaiList').length) {
            $('#aturan_pakaiList').fadeOut();
       }
  });
</script>
<script>
  $('input:text[name=nama_provider]').on('input',function(e){
    var baseURL = mlite.url + '/' + mlite.admin;
    var url    = baseURL + '/apotek_ralan/providerlist?t=' + mlite.token;
    var query = $('input:text[name=nama_provider]').val();
    if(query!="") {
        $.ajax({
             url: url,
             method:"POST",
             data:{query:query},
             success:function(data)
             {
                  $('#kode_providerList').fadeIn();
                  $('#kode_providerList').html(data);
             }
        });
    }
    $('#kode_providerList').fadeIn();
  });

  $('#kode_providerList').on('click', 'li', function(){
       $('#nama_provider').val($(this).text().split(': ')[1]);
       $('#kode_provider').val($(this).text().split(': ')[0]);
       var kode_provider = $('#kode_provider').val();
       $('#kode_providerList').fadeOut();
  });
</script>

<script>
  $(function() {
      $('#rawat_jl_dr').hide();
      $('#rawat_jl_pr').hide();
      $('#pilih_provider').change(function(){
          if($('#pilih_provider').val() == 'rawat_jl_dr') {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').hide();
          } else if($('#pilih_provider').val() == 'rawat_jl_pr') {
              $('#rawat_jl_dr').hide();
              $('#rawat_jl_pr').show();
          } else {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').show();
          }
      });
  });
</script>
<script>
  var count=2;
  $(document).on('click', '.add_racikan', function(){
      var html = '';
      html += '<div class="form-group row_racikan">';
      html += '    <label class="col-sm-3 control-label"><button type="button" class="btn btn-xs btn-danger remove_racikan" title="Hapus baris"><span class="fa fa-minus"></span></button></label>';
      html += '    <div class="col-sm-6">';
      html += '        <select name="kode_brng" class="form-control databarang_ajax">';
      html += '        </select>';
      html += '    </div>';
      html += '    <label class="col-sm-1 control-label rsgm-label-inline">Knd.</label>';
      html += '    <div class="col-sm-2">';
      html += '        <input type="text" name="kandungan" class="form-control text-center" placeholder="0" value="">';
      html += '    </div>';
      html += '</div>';
      $('#item_racikan').append(html);
      count++;
      $('.databarang_ajax').selectator({
        labels: {
          search: 'Cari obat...'
        },
        load: function (search, callback) {
          if (search.length < this.minSearchLength) return callback();
          $.ajax({
            url: '{?=url()?}/{?=ADMIN?}/apotek_ralan/ajax?show=databarang&nama_brng=' + encodeURIComponent(search) + '&t={?=$_SESSION["token"]?}',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
              callback(data.slice(0, 100));
            },
            error: function() {
              callback();
            }
          });
        },
        delay: 300,
        minSearchLength: 1,
        valueField: 'kode_brng',
        textField: 'nama_brng'
      });
  });

  $(document).on('click', '.remove_racikan', function(){
      $(this).closest('.row_racikan').remove();
  });
</script>
