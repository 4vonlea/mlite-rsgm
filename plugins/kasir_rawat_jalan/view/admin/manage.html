<div class="row" id="manage" style="margin-bottom:100px;">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading clearfix" style="padding-bottom: 0px;">
        <h3 class="panel-title pull-left" style="padding-top: 7px; margin-bottom: 10px;">Kelola Pasien Rawat Jalan</h3>
        
        <div class="pull-right" style="margin-bottom: 10px;">
          <div class="form-inline">
            <div class="form-group">
              <div class="input-group">
                <span class="input-group-addon" style="padding: 5px;"><i class="fa fa-calendar"></i></span>
                <input type="text" id="periode_rawat_jalan" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan" required style="width: 100px;">
                <span class="input-group-addon" style="padding: 5px;">-</span>
                <input type="text" id="periode_rawat_jalan_akhir" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan_akhir" required style="width: 100px;">
              </div>
            </div>
            <div class="form-group" style="margin-left: 5px;">
              <div class="btn-group">
                <button type="button" id="submit_periode_rawat_jalan" class="btn btn-primary btn-sm">Semua</button>
                <button type="button" id="belum_periode_rawat_jalan" class="btn btn-warning btn-sm">Belum Diperiksa</button>
                <button type="button" id="selesai_periode_rawat_jalan" class="btn btn-info btn-sm">Selesai Diperiksa</button>
                <button type="button" id="lunas_periode_rawat_jalan" class="btn btn-success btn-sm">Sudah Bayar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-body">
        <div class="row">
          <div id="notif"></div>
        </div>
        <div class="display">
          {include: ../plugins/kasir_rawat_jalan/view/admin/display.html}
        </div>
        <div class="row">
          {include: ../plugins/kasir_rawat_jalan/view/admin/form.rincian.html}
        </div>
        <div>
          <div id="rincian"></div>
          <div id="soap"></div>
          <div id="sep"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
   $(function () {
       $('.periode_rawat_jalan').datetimepicker({
         defaultDate: '{?=date('Y-m-d')?}',
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
       
       $('#periode_rawat_jalan').on('dp.change', function(e) {
           $('#periode_rawat_jalan_akhir').data('DateTimePicker').date(e.date);
       });
   });
</script>
