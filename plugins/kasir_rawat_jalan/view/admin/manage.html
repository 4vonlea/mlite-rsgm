<div class="row" id="manage" style="margin-bottom:100px;">
  <div class="col-md-12">
    <div class="panel panel-default" style="border: 1px solid #dbe3ec; border-radius: 12px; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); overflow: visible; background: #ffffff;">
      <div class="panel-heading rsgm-panel-head" style="border-top-left-radius: 12px; border-top-right-radius: 12px;">
        <h3 class="panel-title" style="display: flex; align-items: center; gap: 9px;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: #eff6ff; color: #2563eb; font-size: 13.5px;">
            <i class="fa fa-calculator"></i>
          </span>
          <span>Kasir Rawat Jalan</span>
        </h3>
        <div class="rsgm-filter-bar">
          <div class="rsgm-date-range">
            <i class="fa fa-calendar rsgm-date-ico"></i>
            <input type="text" id="periode_rawat_jalan" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan" required>
            <span class="rsgm-date-sep">&ndash;</span>
            <input type="text" id="periode_rawat_jalan_akhir" class="form-control periode_rawat_jalan input-sm" name="periode_rawat_jalan_akhir" required>
          </div>
          <div class="rsgm-filter-pills">
            <button type="button" id="submit_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-all">Semua</button>
            <button type="button" id="belum_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-pending">Belum Diperiksa</button>
            <button type="button" id="selesai_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-done">Selesai Diperiksa</button>
            <button type="button" id="lunas_periode_rawat_jalan" class="btn btn-sm rsgm-fpill rsgm-fpill-paid">Sudah Bayar</button>
          </div>
        </div>
      </div>
      <div class="panel-body" style="padding: 20px;">
        <div class="row">
          <div id="notif"></div>
        </div>
        <div class="display">
          {include: ../plugins/kasir_rawat_jalan/view/admin/display.html}
        </div>
        <div class="row">
          {include: ../plugins/kasir_rawat_jalan/view/admin/form.rincian.html}
        </div>
        <div>
          <div id="rincian"></div>
          <div id="soap"></div>
          <div id="sep"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
   $(function () {
       $('.periode_rawat_jalan').datetimepicker({
         defaultDate: "{?=date('Y-m-d')?}",
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
       
       $('#periode_rawat_jalan').on('dp.change', function(e) {
           $('#periode_rawat_jalan_akhir').data('DateTimePicker').date(e.date);
       });
   });
</script>
