<div class="row" id="manage" style="margin-bottom:100px;">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">Kelola Pasien Rawat Jalan</h3>
      </div>
      <div class="panel-body">
        <div class="row clearfix" style="margin-bottom:15px;">
          <div class="col-md-12">
            <div class="form-inline">
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                  <input type="text" id="periode_rawat_jalan" class="form-control periode_rawat_jalan" name="periode_rawat_jalan" placeholder="Tanggal Awal" required>
                </div>
              </div>
              <div class="form-group">
                <div class="input-group">
                  <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                  <input type="text" id="periode_rawat_jalan_akhir" class="form-control periode_rawat_jalan" name="periode_rawat_jalan_akhir" placeholder="Tanggal Akhir" required>
                </div>
              </div>
              <div class="btn-group">
                <button id="submit_periode_rawat_jalan" class="btn btn-primary">Semua</button>
                <button id="belum_periode_rawat_jalan" class="btn btn-warning">Belum Diperiksa</button>
                <button id="selesai_periode_rawat_jalan" class="btn btn-info">Selesai Diperiksa</button>
                <button id="lunas_periode_rawat_jalan" class="btn btn-success">Sudah Bayar</button>
              </div>
            </div>
          </div>
        </div>
        <div class="row">
          <div id="notif"></div>
        </div>
        <div class="display">
          {include: ../plugins/kasir_rawat_jalan/view/admin/display.html}
        </div>
        <div class="row">
          {include: ../plugins/kasir_rawat_jalan/view/admin/form.rincian.html}
        </div>
        <div>
          <div id="rincian"></div>
          <div id="soap"></div>
          <div id="sep"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
   $(function () {
       $('.periode_rawat_jalan').datetimepicker({
         defaultDate: '{?=date('Y-m-d')?}',
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
   });
</script>
