<div class="panel panel-primary">
  <div class="panel-heading">
    <h3 class="panel-title">Laporan Kasir</h3>
  </div>
  <div class="panel-body">
    <form method="get" action="{?= url([ADMIN,'kasir_rawat_jalan','report']) ?}">
      <input type="hidden" name="t" value="{?=$_SESSION['token']?}">
      <input type="hidden" name="penjamin" id="penjamin_filter" value="{?=isset_or($penjamin)?}">
      <div class="row">
        <div class="col-md-4">
          <label>Mulai</label>
          <input type="text" class="form-control tanggal_jam" name="awal" value="{?=isset_or($awal)?}">
        </div>
        <div class="col-md-4">
          <label>Selesai</label>
          <input type="text" class="form-control tanggal_jam" name="akhir" value="{?=isset_or($akhir)?}">
        </div>
        <div class="col-md-4">
          <label>&nbsp;</label>
          <div>
            <button type="submit" class="btn btn-primary" onclick="document.getElementById('penjamin_filter').value=''">Terapkan</button>
            <button type="button" class="btn btn-info" onclick="filterTable('UMUM')">Umum</button>
            <button type="button" class="btn btn-success" onclick="filterTable('BPJ')">BPJS</button>
            <a class="btn btn-default" id="btn-export" href="{?= url([ADMIN,'kasir_rawat_jalan','reportexport']) ?}&awal={?=isset_or($awal)?}&akhir={?=isset_or($akhir)?}&penjamin={?=isset_or($penjamin)?}">Export CSV</a>
            <a class="btn btn-warning" id="btn-print" href="{?= url([ADMIN,'kasir_rawat_jalan','cetakreport']) ?}&awal={?=isset_or($awal)?}&akhir={?=isset_or($akhir)?}&penjamin={?=isset_or($penjamin)?}" target="_blank">Cetak</a>
          </div>
        </div>
      </div>
    </form>

    <hr>
    <div id="laporan">
    <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID Kasir</th>
          <th>Nama Kasir</th>
          <th>Transaksi</th>
          <th>Total</th>
          <th>Mulai</th>
          <th>Selesai</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <hr>
    <div class="table-responsive">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Kode Faktur</th>
          <th>No. Rawat</th>
          <th>No. RM & Nama Pasien</th>
          <th>Unit</th>
          <th>DPJP</th>
          <th>Penjamin</th>
          <th>Kasir</th>
          <th>Total Bayar</th>
          <th>Waktu</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="details"></tbody>
    </table>
    </div>
    </div>
    <script>
      var allData = {?= json_encode($rows) ?};
      var allDetails = {?= json_encode($details ?? []) ?};

      function filterTable(penjamin) {
        document.getElementById('penjamin_filter').value = penjamin;
        
        var exportBtn = document.getElementById('btn-export');
        if (exportBtn) {
           var href = "{?= url([ADMIN,'kasir_rawat_jalan','reportexport']) ?}&awal={?=isset_or($awal)?}&akhir={?=isset_or($akhir)?}";
           if (penjamin === 'UMUM') href += "&penjamin=UMU";
           else if (penjamin === 'BPJ') href += "&penjamin=BPJ";
           exportBtn.href = href;
        }

        var printBtn = document.getElementById('btn-print');
        if (printBtn) {
           var href = "{?= url([ADMIN,'kasir_rawat_jalan','cetakreport']) ?}&awal={?=isset_or($awal)?}&akhir={?=isset_or($akhir)?}";
           if (penjamin === 'UMUM') href += "&penjamin=UMU";
           else if (penjamin === 'BPJ') href += "&penjamin=BPJ";
           printBtn.href = href;
        }

        var filteredDetails = allDetails;
        if (penjamin === 'UMUM') {
          filteredDetails = allDetails.filter(function(d) { return d.png_jawab && d.png_jawab.toUpperCase().indexOf('BPJS') === -1; }); 
        } else if (penjamin === 'BPJ') {
          filteredDetails = allDetails.filter(function(d) { return d.png_jawab && d.png_jawab.toUpperCase().indexOf('BPJS') !== -1; });
        }

        var dtbody = document.getElementById('details');
        dtbody.innerHTML = '';
        var summaryMap = {};
        
        filteredDetails.forEach(function(d){
          var tr = document.createElement('tr');
          var bayar = Number(d.jumlah_harus_bayar || 0);
          tr.innerHTML = '<td>'+ (d.kd_billing || '') +'</td>'+
                         '<td>'+ (d.no_rawat || '') +'</td>'+
                         '<td>'+ (d.no_rkm_medis || '') + ' - ' + (d.nm_pasien || '') +'</td>'+
                         '<td>'+ (d.nm_poli || '') +'</td>'+
                         '<td>'+ (d.nm_dokter || '') +'</td>'+
                         '<td>'+ (d.png_jawab || '') +'</td>'+
                         '<td>'+ (d.nama_kasir || '') +'</td>'+
                         '<td>'+ bayar.toLocaleString('id-ID',{minimumFractionDigits:2, maximumFractionDigits:2}) +'</td>'+
                         '<td>'+ (d.waktu || '') +'</td>'+
                         '<td>'+ (d.keterangan || '') +'</td>';
          dtbody.appendChild(tr);

          var key = d.id_user;
          if (!summaryMap[key]) {
              summaryMap[key] = {
                  id_user: d.id_user,
                  nama_kasir: d.nama_kasir,
                  transaksi: 0,
                  total: 0,
                  mulai: d.waktu,
                  selesai: d.waktu
              };
          }
          summaryMap[key].transaksi++;
          summaryMap[key].total += bayar;
          if (d.waktu < summaryMap[key].mulai) summaryMap[key].mulai = d.waktu;
          if (d.waktu > summaryMap[key].selesai) summaryMap[key].selesai = d.waktu;
        });

        var tbody = document.getElementById('rows');
        tbody.innerHTML = '';
        Object.keys(summaryMap).forEach(function(key) {
            var r = summaryMap[key];
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>'+ (r.id_user || '') +'</td>'+
                           '<td>'+ (r.nama_kasir || '') +'</td>'+
                           '<td>'+ (r.transaksi || 0) +'</td>'+
                           '<td>'+ r.total.toLocaleString('id-ID',{minimumFractionDigits:2, maximumFractionDigits:2}) +'</td>'+
                           '<td>'+ (r.mulai || '') +'</td>'+
                           '<td>'+ (r.selesai || '') +'</td>';
            tbody.appendChild(tr);
        });
        
        if (filteredDetails.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">Tidak ada data</td></tr>';
            dtbody.innerHTML = '<tr><td colspan="10" class="text-center">Tidak ada data</td></tr>';
        }
      }

      (function(){
        var initPenjamin = "{?=isset_or($penjamin)?}";
        if (initPenjamin === 'UMU') initPenjamin = 'UMUM';
        filterTable(initPenjamin);
      })();

      function printContent(el){
        var restore = document.body.innerHTML;
        var content = document.getElementById(el).innerHTML;
        document.body.innerHTML = content;
        window.print();
        document.body.innerHTML = restore;
      }
    </script>
    <script type="text/javascript">
      $(function () {
          $('.tanggal_jam').datetimepicker({
            defaultDate: '{?=date('Y-m-d H:i:s')?}',
            format: 'YYYY-MM-DD HH:mm:ss',
            locale: 'id'
          });
      });
    </script>    
  </div>
</div>
