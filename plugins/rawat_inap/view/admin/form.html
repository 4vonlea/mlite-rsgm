<div id="form" class="rsgm-reg-form clearfix">
  <div class="col-md-12">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-grid">
        <div class="rsgm-reg-col rsgm-reg-col-main">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-bed"></i></span>
              <span>Data Admisi Rawat Inap</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Kamar Inap</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label for="tgl_masuk" class="col-sm-3 control-label">Tgl. Masuk</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-calendar rsgm-field-icon"></i>
                    <input type="text" id="tgl_masuk" name="tgl_masuk" class="form-control tanggal" value="{?=isset_or($rawat_inap.kamar_inap.tgl_masuk)?}">
                  </div>
                </div>
                <label for="jam_masuk" class="col-sm-2 control-label rsgm-label-inline">Jam</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-clock-o rsgm-field-icon"></i>
                    <input type="text" id="jam_masuk" name="jam_masuk" class="form-control jam" value="{?=isset_or($rawat_inap.kamar_inap.jam_masuk)?}">
                  </div>
                </div>
              </div>
              <div class="form-group" id="tanggal_keluar">
                <label for="tgl_keluar" class="col-sm-3 control-label">Tgl. Keluar</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-calendar-check-o rsgm-field-icon"></i>
                    <input type="text" id="tgl_keluar" name="tgl_keluar" class="form-control tanggal" value="{?=isset_or($rawat_inap.kamar_inap.tgl_keluar)?}">
                  </div>
                </div>
                <label for="jam_keluar" class="col-sm-2 control-label rsgm-label-inline">Jam</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-clock-o rsgm-field-icon"></i>
                    <input type="text" id="jam_keluar" name="jam_keluar" class="form-control jam" value="{?=isset_or($rawat_inap.kamar_inap.jam_keluar)?}">
                  </div>
                </div>
              </div>
              <div class="form-group" id="cari_pasien">
                <label for="cari_pasien_input" class="col-sm-3 control-label">Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon rsgm-search-wrap">
                    <i class="fa fa-search rsgm-field-icon"></i>
                    <input type="text" id="cari_pasien_input" name="pasien" class="form-control" placeholder="Ketik Nama / No. RM / No. Rawat lalu Enter..." value="">
                    <button type="button" class="rsgm-search-trigger" title="Cari Pasien (Enter)">Cari &#8629;</button>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Kamar</label>
                <div class="col-sm-5">
                  <select class="form-control" name="kd_kamar">
                    {loop: $rawat_inap.kamar}
                    <option value="{?=isset_or($value.kd_kamar)?}"{if: $rawat_inap.kamar_inap.kd_kamar == $value.kd_kamar} selected{/if}>{?=isset_or($value.nm_bangsal)?} - {?=isset_or($value.kd_kamar)?}</option>
                    {/loop}
                  </select>
                </div>
                <label class="col-sm-2 control-label rsgm-label-inline">Lama</label>
                <div class="col-sm-2">
                  <input type="text" name="lama" class="form-control text-center" placeholder="Hari" value="{?=isset_or($rawat_inap.kamar_inap.lama)?}">
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Dokter</label>
                <div class="col-sm-9">
                  <select class="form-control" name="kd_dokter">
                    {loop: $rawat_inap.dokter}
                    <option value="{?=isset_or($value.kd_dokter)?}"{if: $rawat_inap.kamar_inap.kd_dokter == $value.kd_dokter} selected{/if}>{?=isset_or($value.nm_dokter)?}</option>
                    {/loop}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Penjamin</label>
                <div class="col-sm-9">
                  <select class="form-control" name="kd_pj">
                    {loop: $rawat_inap.penjab}
                    <option value="{?=isset_or($value.kd_pj)?}"{if: $rawat_inap.kamar_inap.kd_pj == $value.kd_pj} selected{/if}>{?=isset_or($value.png_jawab)?}</option>
                    {/loop}
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="rsgm-reg-col rsgm-reg-col-side">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-id-card-o"></i></span>
              <span>Identitas Pasien &amp; Diagnosa</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Ringkasan Inap</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-3 control-label">Nomor RM</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-address-card-o rsgm-field-icon"></i>
                    <input type="text" name="no_rkm_medis" class="form-control" placeholder="Nomor rekam medik" value="{?=isset_or($rawat_inap.kamar_inap.no_rkm_medis)?}" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Nama Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-user-o rsgm-field-icon"></i>
                    <input type="text" name="nm_pasien" class="form-control" placeholder="Nama lengkap pasien" value="{?=isset_or($rawat_inap.kamar_inap.nm_pasien)?}" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">No. Rawat</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-hashtag rsgm-field-icon"></i>
                    <input type="text" name="no_rawat" class="form-control" placeholder="Nomor rawat kunjungan" value="{?=isset_or($rawat_inap.kamar_inap.no_rawat)?}" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group" id="diagnosa_masuk">
                <label class="col-sm-3 control-label">Diag. Masuk</label>
                <div class="col-sm-9">
                  <input type="text" name="diagnosa_awal" class="form-control" placeholder="Isi diagnosa awal masuk..." value="{?=isset_or($rawat_inap.kamar_inap.diagnosa_awal)?}">
                </div>
              </div>
              <div id="diagnosa_keluar">
                <div class="form-group">
                  <label class="col-sm-3 control-label">Diag. Keluar</label>
                  <div class="col-sm-9">
                    <input type="text" name="diagnosa_akhir" class="form-control" placeholder="Isi diagnosa akhir pulang..." value="{?=isset_or($rawat_inap.kamar_inap.diagnosa_akhir)?}">
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-3 control-label">Status Keluar</label>
                  <div class="col-sm-9">
                    <select class="form-control" name="stts_pulang">
                      {loop: $rawat_inap.stts_pulang}
                      <option value="{?=isset_or($value)?}"{if: $rawat_inap.kamar_inap.stts_pulang == $value} selected{/if}>{?=isset_or($value)?}</option>
                      {/loop}
                    </select>
                  </div>
                </div>
              </div>
              <div id="stts_daftar"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="pasien" class="rsgm-pasien-drawer"></div>

      <div class="rsgm-reg-footer">
        <span class="rsgm-footer-hint hidden-xs">
          <i class="fa fa-info-circle"></i> Pilih pasien dari kunjungan aktif sebelum menentukan kamar rawat inap
        </span>
        <div class="rsgm-reg-actions">
          <button type="button" name="button" class="btn btn-primary" id="simpan" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_create', 'rawat_inap') == false}disabled{/if}><i class="fa fa-save"></i><span class="hidden-xs"> Simpan</span></button>
          <button type="button" name="button" class="btn btn-info" id="simpan_keluar" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_update', 'rawat_inap') == false}disabled{/if}><i class="fa fa-sign-out"></i><span class="hidden-xs"> Keluar</span></button>
          <button type="button" name="button" class="btn btn-danger" id="hapus" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_delete', 'rawat_inap') == false}disabled{/if}><i class="fa fa-trash-o"></i><span class="hidden-xs"> Hapus</span></button>
          <button type="button" name="button" class="btn btn-default" id="batal"><i class="fa fa-times"></i><span class="hidden-xs"> Batal</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
  function cariPasienRawatInap() {
    var baseURL = mlite.url + '/' + mlite.admin;
    var url = baseURL + '/rawat_inap/pasien?t=' + mlite.token;
    var cari = $('input:text[name=pasien]').val();
    if (cari !== "") {
      $.post(url, {cari: cari}, function(data) {
        $("#pasien").html(data).show();
      });
    } else {
      $("#pasien").hide();
    }
  }

  if (window.location.search.indexOf('no_rawat') !== -1) {
    let searchParams = new URLSearchParams(window.location.search);
    $('input:text[name=pasien]').val(searchParams.get('no_rawat'));
    cariPasienRawatInap();
  }

  $('select').selectator();

  $('input:text[name=pasien]').on('keydown', function(e) {
    var key = e.which || e.keyCode;
    if (key == 13) {
      e.preventDefault();
      cariPasienRawatInap();
    }
  });

  $('.rsgm-search-trigger').on('click', function(e) {
    e.preventDefault();
    cariPasienRawatInap();
  });

  $("#pasien").on("click", ".rsgm-pasien-close", function(e) {
    e.preventDefault();
    $("#pasien").hide();
  });

  $("#batal").on("click", function() {
    $("#stts_daftar").hide();
  });

  // ketika baris data diklik
  $("#pasien").on("click", ".pilih", function(event) {
    var baseURL = mlite.url + '/' + mlite.admin;
    event.preventDefault();

    var no_rkm_medis = $(this).attr("data-no_rkm_medis");
    var nm_pasien    = $(this).attr("data-nm_pasien");
    var no_rawat     = $(this).attr("data-no_rawat");

    var url = baseURL + '/rawat_inap/statusdaftar?t=' + mlite.token;

    $.post(url, {no_rkm_medis: no_rkm_medis}, function(data) {
      $("#stts_daftar").html(data).show();
    });

    $('input:text[name=no_rkm_medis]').val(no_rkm_medis);
    $('input:text[name=nm_pasien]').val(nm_pasien);
    $('input:text[name=no_rawat]').val(no_rawat);

    $("#pasien").hide();
  });
</script>
<script type="text/javascript">
  $(function () {
    $('.tanggal_jam').datetimepicker({
      format: 'YYYY-MM-DD HH:mm:ss',
      locale: 'id'
    });
  });
  $(function () {
    $('.tanggal').datetimepicker({
      format: 'YYYY-MM-DD',
      locale: 'id'
    });
  });
  $(function () {
    $('.jam').datetimepicker({
      format: 'HH:mm:ss',
      locale: 'id'
    });
  });
</script>
