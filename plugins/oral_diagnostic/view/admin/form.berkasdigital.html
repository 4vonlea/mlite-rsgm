<div id="form_berkasdigital" class="rsgm-reg-form clearfix">
  <div class="col-md-6">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-header">
        <h4 class="rsgm-reg-title">
          <span class="rsgm-reg-icon"><i class="fa fa-id-card-o"></i></span>
          <span>Identitas Kunjungan Pasien</span>
        </h4>
        <span class="rsgm-reg-badge-hint hidden-xs">Berkas Digital</span>
      </div>
      <div class="rsgm-reg-body">
        <div class="form-horizontal">
          <div class="form-group">
            <label for="tgl_perawatan" class="col-sm-3 control-label">Tanggal</label>
            <div class="col-sm-4">
              <div class="rsgm-input-icon">
                <i class="fa fa-calendar rsgm-field-icon"></i>
                <input type="text" id="tgl_perawatan" name="tgl_perawatan" class="form-control tanggal" value="{?=date('Y-m-d')?}">
              </div>
            </div>
            <label for="jam_reg" class="col-sm-1 control-label rsgm-label-inline">Jam</label>
            <div class="col-sm-4">
              <div class="rsgm-input-icon">
                <i class="fa fa-clock-o rsgm-field-icon"></i>
                <input type="text" id="jam_reg" name="jam_reg" class="form-control jam" value="{?=date('H:i:s')?}">
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="no_rawat" class="col-sm-3 control-label">Id Rawat</label>
            <div class="col-sm-9">
              <div class="rsgm-input-icon">
                <i class="fa fa-hashtag rsgm-field-icon"></i>
                <input type="text" name="no_rawat" placeholder="ID Pendaftaran" class="form-control" id="no_rawat" value="" readonly>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="no_rkm_medis" class="col-sm-3 control-label">Nomor RM</label>
            <div class="col-sm-9">
              <div class="rsgm-input-icon">
                <i class="fa fa-address-card-o rsgm-field-icon"></i>
                <input type="text" name="no_rkm_medis" class="form-control" id="no_rkm_medis" placeholder="Nomor Rekam Medik" value="" readonly>
              </div>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="col-sm-3 control-label">Nama Pasien</label>
            <div class="col-sm-9">
              <div class="rsgm-input-icon">
                <i class="fa fa-user-o rsgm-field-icon"></i>
                <input type="text" name="nm_pasien" class="form-control" placeholder="Nama pasien" value="" readonly>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-header">
        <h4 class="rsgm-reg-title">
          <span class="rsgm-reg-icon"><i class="fa fa-cloud-upload"></i></span>
          <span>Unggah Berkas Digital</span>
        </h4>
        <span class="rsgm-reg-badge-hint hidden-xs">Upload Gambar</span>
      </div>
      <div class="rsgm-reg-body">
        <div class="form-horizontal">
          <div class="form-group">
            <label for="kode" class="col-sm-3 control-label">Kategori</label>
            <div class="col-sm-9">
              <select name="kode" id="kode" class="form-control">
                {loop: $master_berkas_digital}
                  <option value="{?=isset_or($value.kode)?}">{?=isset_or($value.nama)?}</option>
                {/loop}
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="berkas" class="col-sm-3 control-label">Pilih Berkas</label>
            <div class="col-sm-9">
              <input type="file" name="berkas" accept="image/*" id="berkas" class="form-control" />
              <div id="berkasdigitalstatus" style="margin-top: 6px;"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="rsgm-reg-footer">
        <span class="rsgm-footer-hint hidden-xs"><i class="fa fa-info-circle"></i> Format: JPG, JPEG, PNG, GIF</span>
        <div class="rsgm-reg-actions">
          <button type="button" name="button" class="btn btn-primary" id="simpan_berkas_digital"><i class="fa fa-upload"></i><span class="hidden-xs"> Unggah Berkas</span></button>
          <button type="button" name="button" class="btn btn-success" id="selesai_berkasdigital"><i class="fa fa-check"></i><span class="hidden-xs"> Selesai</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
  $("#form_berkasdigital").on("click", "#simpan_berkas_digital", function(event){
      var property = document.getElementById('berkas').files[0];
      if (!property) {
        alert("Silakan pilih file gambar terlebih dahulu.");
        return false;
      }
      var image_name = property.name;
      var image_extension = image_name.split('.').pop().toLowerCase();

      if(jQuery.inArray(image_extension,['gif','jpg','jpeg','png']) == -1){
        alert("Format file harus gambar (gif, jpg, jpeg, png).");
        return false;
      }

      var form_data = new FormData();
      var no_rawat = $('#form_berkasdigital input[name=no_rawat]').val() || $('input:text[name=no_rawat]').val();
      form_data.append("file",property);
      form_data.append("no_rawat",no_rawat);
      form_data.append("kode",$('#form_berkasdigital #kode').val());
      $.ajax({
        url:'{?=url([ADMIN,'oral_diagnostic','saveberkasdigital'])?}',
        method:'POST',
        data:form_data,
        contentType:false,
        cache:false,
        processData:false,
        beforeSend:function(){
          $('#berkasdigitalstatus').html('Mengunggah......');
        },
        success:function(data){
          $('#berkasdigitalstatus').html(data);

          var baseURL = mlite.url + '/' + mlite.admin;
          var url = baseURL + '/oral_diagnostic/berkasdigital?t=' + mlite.token;
          $.post(url, {no_rawat : no_rawat,
          }, function(data) {
            $("#berkasdigital").html(data).show();
          });

        }
      });

  });
  $("#form_berkasdigital").on("click", "#selesai_berkasdigital", function(event){
    bersih();
    $("#form_berkasdigital").hide();
    $("#form_rincian").hide();
    $("#form_soap").hide();
    $("#form").show();
    $("#display").show();
    $("#rincian").hide();
    $("#berkasdigital").hide();
    $("#soap").hide();
  });
</script>
