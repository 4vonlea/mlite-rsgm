{if: !empty($berkas_digital)}
<div class="rsgm-rincian-card" style="margin-top: 14px;">
  <div class="rsgm-rincian-card-head">
    <div class="rsgm-rincian-card-title">
      <span class="rsgm-rincian-icon rsgm-rincian-icon-blue"><i class="fa fa-folder-open-o"></i></span>
      <div>
        <h5>Berkas Digital Perawatan</h5>
        <small>Lampiran dokumen &amp; foto klinis kunjungan</small>
      </div>
    </div>
    <span class="rsgm-rincian-total">Total: <strong>{?=count($berkas_digital)?}</strong></span>
  </div>
  <div class="rsgm-rincian-card-body" style="padding: 14px;">
    <div class="row">
      <div class="gallery">
      {loop: $berkas_digital}
        <div class="col-sm-4 col-md-3" style="margin-bottom: 12px;">
          <div class="thumbnail" style="margin-bottom: 0; border-radius: 8px; overflow: hidden;">
            <a href="{?=url(WEBAPPS_URL.'/berkasrawat/'.$value.lokasi_file)?}" class="images">
              <img src="{?=url(WEBAPPS_URL.'/berkasrawat/'.$value.lokasi_file)?}" class="img-responsive">
            </a>
          </div>
        </div>
      {/loop}
      </div>
    </div>
  </div>
</div>
{/if}
