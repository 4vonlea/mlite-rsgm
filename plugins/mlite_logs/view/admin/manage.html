<div class="row">
  <div class="col-md-12">
    <div class="rsgm-reg-shell" style="overflow: visible;">
      <!-- Header RSGM Clean -->
      <div class="rsgm-reg-header" style="padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <h4 class="rsgm-reg-title" style="margin: 0;">
            <span class="rsgm-reg-icon"><i class="fa fa-database"></i></span>
            <span>Log Aktivitas Query</span>
          </h4>
          <span class="rsgm-badge rsgm-badge-sky" id="logs_total_badge" style="font-size: 11px;">Memuat...</span>
          {if: !empty($log_query_enabled)}
          <span class="rsgm-badge rsgm-badge-emerald" style="font-size: 11px;" title="Pengaturan settings.log_query aktif — setiap query SQL dicatat ke mlite_query_logs"><i class="fa fa-circle"></i> Log Query Aktif</span>
          {else}
          <span class="rsgm-badge rsgm-badge-amber" style="font-size: 11px;"><i class="fa fa-pause-circle"></i> Log Query Nonaktif</span>
          {/if}
        </div>

        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
          <button type="button" id="lihat_detail_mlite_query_logs" class="btn btn-sm btn-primary" style="border-radius: 6px; font-weight: 600;" title="Lihat detail lengkap baris terpilih (atau klik 2x pada baris)">
            <i class="fa fa-file-text-o"></i> <span class="hidden-xs">Detail</span>
          </button>
          <button type="button" id="lihat_data_mlite_query_logs" class="btn btn-sm btn-default" style="border-radius: 6px; font-weight: 600; border: 1px solid #cbd5e1; background: #ffffff; color: #334155;" title="Pratinjau &amp; ekspor maksimal 200 log terbaru">
            <i class="fa fa-download text-primary"></i> <span class="hidden-xs">Pratinjau / Ekspor</span>
          </button>
          <button type="button" id="btn_prune_logs" class="btn btn-sm btn-danger" style="border-radius: 6px; font-weight: 600;" title="Hapus log lama lebih dari 30 hari agar tabel tetap ringan">
            <i class="fa fa-trash-o"></i> <span class="hidden-xs">Bersihkan &gt;30 Hari</span>
          </button>
        </div>
      </div>

      <div class="panel-body" style="padding: 16px 18px;">
        <!-- Toolbar Pencarian Terintegrasi -->
        <div class="logs-toolbar">
          <div class="logs-toolbar-left">
            <label for="search_field_mlite_query_logs" class="logs-toolbar-label"><i class="fa fa-filter text-primary"></i> Filter</label>
            <select class="form-control input-sm" id="search_field_mlite_query_logs" name="search_field_mlite_query_logs" data-use-search="false" data-use-dimmer="false" style="width: 165px;">
              <option value="sql_text">SQL Text</option>
              <option value="id">Id</option>
              <option value="username">Username / NIK</option>
              <option value="created_at">Waktu (Created At)</option>
              <option value="bindings">Bindings</option>
              <option value="error_message">Error Message</option>
            </select>
            <div class="logs-search-box">
              <input class="form-control input-sm" name="search_text_mlite_query_logs" id="search_text_mlite_query_logs" type="search" placeholder="Ketik kata kunci lalu tekan Enter...">
              <button type="button" id="search_mlite_query_logs" class="btn btn-sm btn-primary logs-btn-search" title="Cari log">
                <i class="fa fa-search"></i> Cari
              </button>
              <button type="button" id="reset_mlite_query_logs" class="btn btn-sm btn-default logs-btn-reset" title="Reset pencarian">
                <i class="fa fa-refresh"></i>
              </button>
            </div>
          </div>
          <div class="logs-toolbar-hint text-muted">
            <i class="fa fa-info-circle"></i> Urutan terbaru (`Id` DESC) &bull; Klik baris / 2x klik untuk detail
          </div>
        </div>

        <div class="table-responsive" style="border: 1px solid #e2e8f0; border-radius: 8px; overflow-x: auto;">
          <table id="tbl_mlite_query_logs" class="table table-hover table-striped display dataTable logs-table" style="width:100%; margin: 0;">
            <thead>
              <tr>
                <th width="85">Id</th>
                <th width="180">Pengguna</th>
                <th width="145">Waktu</th>
                <th>SQL Query</th>
                <th width="210">Bindings</th>
                <th width="140">Error</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Pratinjau & Ekspor -->
<div id="modal_lihat_mlite_query_logs" class="modal fade" role="dialog" tabindex="-1">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content" style="border-radius: 8px; overflow: hidden;">
      <div class="modal-header" style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
        <button class="close" type="button" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" style="font-weight: 700; font-size: 15px;"><i class="fa fa-table text-primary"></i> <span id="modal-title">Pratinjau 200 Log Terbaru</span></h4>
      </div>
      <div class="modal-body" style="max-height: 70vh; overflow: auto;">
        <div id="forTable_mlite_query_logs"></div>
      </div>
      <div class="modal-footer" style="background: #f8fafc; border-top: 1px solid #e2e8f0;">
        <button class="btn btn-sm btn-default" type="button" data-dismiss="modal">Tutup</button>
        <button type="button" id="view_chart" class="btn btn-sm btn-info"><i class="fa fa-pie-chart"></i> Chart</button>
        <button type="button" id="export_pdf" class="btn btn-sm btn-danger"><i class="fa fa-file-pdf-o"></i> PDF</button>
        <button type="button" id="export_xlsx" class="btn btn-sm btn-success"><i class="fa fa-file-excel-o"></i> XLSX</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Detail -->
<div id="modal_detail_mlite_query_logs" class="modal fade" role="dialog" tabindex="-1">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content" style="border-radius: 8px; overflow: hidden;"></div>
  </div>
</div>
