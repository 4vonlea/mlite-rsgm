<div class="modal-header">
  <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span> Tutup</button>
  <h4 class="modal-title"><i class="fa fa-heartbeat"></i> Program Rujuk Balik (PRB / SRB BPJS)</h4>
</div>
<div class="modal-body">
  <div id="form_srb">
    <div class="panel panel-primary" style="margin-bottom: 15px;">
      <div class="panel-heading">
        <h3 class="panel-title"><i class="fa fa-pencil"></i> Formulir Pembuatan Surat Rujuk Balik (SRB)</h3>
      </div>
      <div class="panel-body">
        <div id="srb_alert"></div>
        <div class="row clearfix">
          <div class="col-md-6">
            <div class="form-group">
              <label>Nomor SEP <span class="text-danger">*</span></label>
              <input type="text" name="no_sep" id="no_sep" class="form-control" value="{?=isset_or($no_sep)?}" placeholder="Nomor SEP Pasien" required />
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label>Nomor Peserta BPJS</label>
              <input type="text" name="no_peserta" id="no_peserta" class="form-control" value="{?=isset_or($no_kartu)?}" readonly />
            </div>
          </div>

          <div class="col-md-8">
            <div class="form-group">
              <label>Dokter DPJP <span class="text-danger">*</span></label>
              <input type="text" name="nm_dpjp" id="nm_dpjp" class="form-control" value="{?=isset_or($nmdpjp)?}" placeholder="Nama Dokter DPJP">
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>Kode DPJP</label>
              <input type="text" name="dpjp" id="dpjp" class="form-control" value="{?=isset_or($kddpjp)?}" placeholder="Kode Dokter DPJP">
            </div>
          </div>

          <div class="col-md-8">
            <div class="form-group">
              <label>Alamat Pasien <span class="text-danger">*</span></label>
              <input type="text" name="alamat" id="alamat" class="form-control" value="{?=isset_or($alamat)?}" placeholder="Alamat Pasien" required />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label>Email Pasien</label>
              <input type="email" name="email" id="email" class="form-control" placeholder="pasien@email.com (opsional)" />
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-group">
              <label>Tanggal SRB <span class="text-danger">*</span></label>
              <input type="text" name="tanggal_srb" id="tanggal_srb" class="form-control tanggal" value="{?=date('Y-m-d')?}" />
            </div>
          </div>
          <div class="col-md-5">
            <div class="form-group" style="position:relative;">
              <label>Program PRB (Pilih / Klik) <span class="text-danger">*</span></label>
              <input type="text" name="sep_diagnosa_nama_srb" id="sep_diagnosa_nama_srb" class="form-control" placeholder="Klik untuk pilih Program PRB..." autocomplete="off">
              <ul class="list-group" id="diagnosaListSrb" style="z-index:9999;position:absolute;width:100%;max-height:220px;overflow-y:auto;display:none;box-shadow:0 4px 8px rgba(0,0,0,0.2);"></ul>
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <label>Kode Program</label>
              <input type="text" name="sep_diagnosa_kode_srb" id="sep_diagnosa_kode_srb" class="form-control" readonly placeholder="Kode Program">
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-group" style="position:relative;">
              <label>Obat PRB (Ketik Nama Obat) <span class="text-danger">*</span></label>
              <input type="text" name="sep_nama_obat" id="sep_nama_obat" class="form-control" placeholder="Ketik min 3 huruf obat..." autocomplete="off">
              <ul class="list-group" id="ListObat" style="z-index:9999;position:absolute;width:100%;max-height:220px;overflow-y:auto;display:none;box-shadow:0 4px 8px rgba(0,0,0,0.2);"></ul>
            </div>
          </div>
          <div class="col-md-2">
            <div class="form-group">
              <label>Kode Obat</label>
              <input type="text" name="sep_kode_obat" id="sep_kode_obat" class="form-control" readonly placeholder="Kode Obat">
            </div>
          </div>
          <div class="col-md-2">
            <div class="form-group">
              <label>Jumlah Obat <span class="text-danger">*</span></label>
              <input type="number" name="jumlah_obat" id="jumlah_obat" class="form-control" value="30">
            </div>
          </div>
          <div class="col-md-2">
            <div class="form-group">
              <label>Signa 1 <span class="text-danger">*</span></label>
              <input type="text" name="signa1" id="signa1" class="form-control" value="3" placeholder="Contoh: 3">
            </div>
          </div>
          <div class="col-md-2">
            <div class="form-group">
              <label>Signa 2 <span class="text-danger">*</span></label>
              <input type="text" name="signa2" id="signa2" class="form-control" value="1" placeholder="Contoh: 1">
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label>Keterangan</label>
              <input type="text" name="keterangan" id="keterangan" class="form-control" value="Kondisi pasien stabil, rujuk balik ke FKTP" placeholder="Keterangan kondisi klinis" />
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label>Saran Pengelolaan di FKTP</label>
              <input type="text" name="saran" id="saran" class="form-control" value="Kontrol rutin dan pemberian obat di FKTP" placeholder="Saran pengelolaan" />
            </div>
          </div>
        </div>

        <div class="row clearfix">
          <div class="col-md-12">
            <button type="button" class="btn btn-primary" id="simpan_srb"><i class="fa fa-save"></i> Simpan Program PRB ke BPJS</button>
            <button type="button" class="btn btn-default" id="refresh_srb"><i class="fa fa-refresh"></i> Refresh Riwayat</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel panel-default">
    <div class="panel-heading">
      <h3 class="panel-title"><i class="fa fa-list"></i> Riwayat Program PRB Pasien Ini</h3>
    </div>
    <div class="panel-body" style="padding:0;">
      <div id="srbdisplay">
        <div class="text-center text-muted" style="padding:20px;"><i class="fa fa-spinner fa-spin"></i> Memuat data PRB...</div>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-default" data-dismiss="modal">Tutup</button>
</div>

<script type="text/javascript">
  $(function () {
    $('.tanggal').datetimepicker({
      format: 'YYYY-MM-DD',
      locale: 'id'
    });
  });

  function reloadSrbDisplay() {
    var baseURL = mlite.url + '/' + mlite.admin;
    var no_peserta = $('#no_peserta').val();
    if (no_peserta) {
      $("#srbdisplay").show().load(baseURL + '/vclaim/srbdisplay/' + encodeURIComponent(no_peserta) + '?t=' + mlite.token);
    }
  }

  $(document).ready(function () {
    reloadSrbDisplay();
  });

  $('#refresh_srb').on('click', function () {
    reloadSrbDisplay();
  });

  // Simpan SRB
  $("#form_srb").on("click", "#simpan_srb", function (event) {
    var baseURL = mlite.url + '/' + mlite.admin;
    event.preventDefault();

    var no_sep = $('#no_sep').val();
    var no_peserta = $('#no_peserta').val();
    var alamat = $('#alamat').val();
    var email = $('#email').val() || '';
    var tanggal_srb = $('#tanggal_srb').val();
    var sep_diagnosa_nama_srb = $('#sep_diagnosa_nama_srb').val();
    var sep_diagnosa_kode_srb = $('#sep_diagnosa_kode_srb').val();
    var dpjp = $('#dpjp').val();
    var nm_dpjp = $('#nm_dpjp').val();
    var sep_nama_obat = $('#sep_nama_obat').val();
    var sep_kode_obat = $('#sep_kode_obat').val();
    var jumlah = $('#jumlah_obat').val();
    var signa1 = $('#signa1').val();
    var signa2 = $('#signa2').val();
    var keterangan = $('#keterangan').val();
    var saran = $('#saran').val();

    if (!no_sep) {
      alert('Nomor SEP wajib diisi!');
      $('#no_sep').focus();
      return;
    }
    if (!dpjp) {
      alert('Kode Dokter DPJP wajib diisi!');
      $('#dpjp').focus();
      return;
    }
    if (!alamat) {
      alert('Alamat pasien wajib diisi!');
      $('#alamat').focus();
      return;
    }
    if (!sep_diagnosa_kode_srb) {
      alert('Program PRB wajib dipilih dari daftar pencarian!');
      $('#sep_diagnosa_nama_srb').focus();
      return;
    }
    if (!sep_kode_obat) {
      alert('Obat PRB wajib dipilih dari daftar pencarian!');
      $('#sep_nama_obat').focus();
      return;
    }
    if (!jumlah || jumlah <= 0) {
      alert('Jumlah obat harus lebih dari 0!');
      $('#jumlah_obat').focus();
      return;
    }

    var $btn = $('#simpan_srb');
    var originalBtnText = $btn.html();
    $btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Menyimpan ke BPJS...');

    var url = baseURL + '/vclaim/savesrb?t=' + mlite.token;

    $.post(url, {
      no_sep: no_sep,
      no_peserta: no_peserta,
      alamat: alamat,
      saran: saran,
      keterangan: keterangan,
      email: email,
      tanggal_srb: tanggal_srb,
      sep_diagnosa_nama_srb: sep_diagnosa_nama_srb,
      sep_diagnosa_kode_srb: sep_diagnosa_kode_srb,
      dpjp: dpjp,
      nm_dpjp: nm_dpjp,
      sep_nama_obat: sep_nama_obat,
      sep_kode_obat: sep_kode_obat,
      jumlah: jumlah,
      signa1: signa1,
      signa2: signa2
    }, function (data) {
      $btn.prop('disabled', false).html(originalBtnText);
      alert(data);
      if (data.indexOf('Sukses') !== -1 || data.indexOf('sukses') !== -1) {
        $('#srb_alert').html('<div class="alert alert-success alert-dismissible"><button type="button" class="close" data-dismiss="alert">&times;</button>' + data + '</div>');
        reloadSrbDisplay();
      } else {
        $('#srb_alert').html('<div class="alert alert-danger alert-dismissible"><button type="button" class="close" data-dismiss="alert">&times;</button>' + data + '</div>');
      }
    }).fail(function () {
      $btn.prop('disabled', false).html(originalBtnText);
      alert('Terjadi kesalahan komunikasi dengan server!');
    });
  });

  // Hapus SRB
  $('#srbdisplay').on('click', '.btn-hapus-srb', function () {
    var no_srb = $(this).attr('data-nosrb');
    var no_sep = $(this).attr('data-nosep');
    if (!confirm('Apakah Anda yakin ingin menghapus SRB No. ' + no_srb + ' di BPJS dan database lokal?')) {
      return;
    }

    var baseURL = mlite.url + '/' + mlite.admin;
    var url = baseURL + '/vclaim/hapussrb?t=' + mlite.token;

    $.post(url, {
      no_srb: no_srb,
      no_sep: no_sep
    }, function (data) {
      alert(data);
      reloadSrbDisplay();
    }).fail(function () {
      alert('Gagal menghubungi server!');
    });
  });

  // Autocomplete Diagnosa PRB (fetch list from BPJS)
  function fetchDiagnosaPrb() {
    var baseURL = mlite.url + '/' + mlite.admin;
    $.ajax({
      url: baseURL + '/vclaim/diagnosaprb?t=' + mlite.token,
      method: "GET",
      data: {},
      success: function (data) {
        try {
          var res = JSON.parse(data);
          var output = '';
          if (res.metaData && res.metaData.code == 200 && res.response && res.response.list) {
            var list = res.response.list;
            for (var i = 0; i < list.length; i++) {
              output += '<li class="list-group-item link-class" style="cursor:pointer;" data-kode="' + list[i].kode + '" data-nama="' + list[i].nama + '"><b>' + list[i].kode + '</b>: ' + list[i].nama + '</li>';
            }
          } else {
            output = '<li class="list-group-item text-muted">' + (res.metaData ? res.metaData.message : 'Tidak ditemukan') + '</li>';
          }
          $('#diagnosaListSrb').html(output).fadeIn();
        } catch(e) {}
      }
    });
  }

  $('#sep_diagnosa_nama_srb').on('click focus', function () {
    fetchDiagnosaPrb();
  });

  $('#sep_diagnosa_nama_srb').on('keyup', function () {
    var filter = $(this).val().toLowerCase();
    $('#diagnosaListSrb li').each(function () {
      var text = $(this).text().toLowerCase();
      if (text.indexOf(filter) !== -1) {
        $(this).show();
      } else {
        $(this).hide();
      }
    });
  });

  $('#diagnosaListSrb').on('click', 'li.link-class', function () {
    $('#sep_diagnosa_nama_srb').val($(this).data('nama'));
    $('#sep_diagnosa_kode_srb').val($(this).data('kode'));
    $('#diagnosaListSrb').fadeOut();
  });

  // Autocomplete Obat PRB
  $('#sep_nama_obat').keyup(function () {
    var query = $(this).val();
    if (query.length >= 3) {
      var baseURL = mlite.url + '/' + mlite.admin;
      $.ajax({
        url: baseURL + '/vclaim/obatprb/' + encodeURIComponent(query) + '?t=' + mlite.token,
        method: "GET",
        data: {},
        success: function (data) {
          try {
            var res = JSON.parse(data);
            var output = '';
            if (res.metaData && res.metaData.code == 200 && res.response && res.response.list) {
              var obat = res.response.list;
              for (var i = 0; i < obat.length; i++) {
                output += '<li class="list-group-item link-class" style="cursor:pointer;" data-kode="' + obat[i].kode + '" data-nama="' + obat[i].nama + '"><b>' + obat[i].kode + '</b>: ' + obat[i].nama + '</li>';
              }
            } else {
              output = '<li class="list-group-item text-muted">' + (res.metaData ? res.metaData.message : 'Tidak ditemukan') + '</li>';
            }
            $('#ListObat').html(output).fadeIn();
          } catch(e) {}
        }
      });
    } else {
      $('#ListObat').fadeOut();
    }
  });

  $('#ListObat').on('click', 'li.link-class', function () {
    $('#sep_nama_obat').val($(this).data('nama'));
    $('#sep_kode_obat').val($(this).data('kode'));
    $('#ListObat').fadeOut();
  });

  // Hide lists when clicking outside
  $(document).on('click', function (e) {
    if (!$(e.target).closest('#diagnosaListSrb, #sep_diagnosa_nama_srb').length) {
      $('#diagnosaListSrb').fadeOut();
    }
    if (!$(e.target).closest('#ListObat, #sep_nama_obat').length) {
      $('#ListObat').fadeOut();
    }
  });
</script>
