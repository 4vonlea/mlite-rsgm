<div class="rsgm-pasien-box">
  <div class="rsgm-pasien-head">
    <span><i class="fa fa-stethoscope"></i> Hasil Pencarian Tindakan / Layanan &mdash; Klik baris untuk memilih</span>
    <button type="button" class="rsgm-pasien-close"><i class="fa fa-times"></i> Tutup</button>
  </div>
  <div class="rsgm-pasien-scroll">
    <table class="table table-striped table-hover" width="100%">
      <thead>
        <tr>
          <th width="18%">ID Tindakan</th>
          <th>Nama Tindakan</th>
          <th width="24%" class="text-right">Tarif</th>
        </tr>
      </thead>
      <tbody>
        {if: $layanan}
        {loop: $layanan}
        <tr class="pilih_layanan pilih" data-kd_jenis_prw="{?=isset_or($value.kd_jenis_prw)?}" data-nm_perawatan="{?=isset_or($value.nm_perawatan)?}" data-biaya="{?=isset_or($value.total_byrdr)?}" data-kat="tindakan">
          <td><span class="rsgm-badge rsgm-badge-slate">{?=isset_or($value.kd_jenis_prw)?}</span></td>
          <td><strong>{?=isset_or($value.nm_perawatan)?}</strong></td>
          <td class="text-right" style="font-variant-numeric: tabular-nums; font-weight: 600;">Rp {?= number_format($value.total_byrdr,2,',','.')?}</td>
        </tr>
        {/loop}
        {else}
        <tr>
          <td colspan="3" class="text-center text-muted">Data layanan tidak ditemukan.</td>
        </tr>
        {/if}
      </tbody>
    </table>
  </div>
</div>
