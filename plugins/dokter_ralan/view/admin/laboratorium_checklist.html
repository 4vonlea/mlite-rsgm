<div class="row" style="margin-bottom: 20px;">
  <div class="col-md-6">
    <div class="form-group" style="margin-bottom: 0;">
      <label>Diagnosa Klinis</label>
      <input type="text" id="modal_diagnosa_klinis" class="form-control" placeholder="Isi diagnosa klinis pasien" value="{?=isset_or($diagnosa_klinis)?}">
    </div>
  </div>
  <div class="col-md-6">
    <div class="form-group" style="margin-bottom: 0;">
      <label>Informasi Tambahan</label>
      <input type="text" id="modal_info_tambahan" class="form-control" placeholder="Keterangan klinis lainnya" value="{?=isset_or($informasi_tambahan)?}">
    </div>
  </div>
</div>
<hr style="margin-top: 10px; margin-bottom: 20px;">

<div style="column-count: 3; column-gap: 20px;">
  {loop: $grouped_labs}
  <div class="panel panel-default" style="margin-bottom: 15px; border-top: 3px solid #3498db; break-inside: avoid; page-break-inside: avoid;">
    <div class="panel-heading" style="padding: 8px 15px;">
      <h3 class="panel-title" style="font-size: 14px; font-weight: bold;">{?=isset_or($key)?}</h3>
    </div>
    <div class="panel-body" style="padding: 10px 15px;">
      {loop: $value as $item}
      <div class="checkbox" style="margin-top: 5px; margin-bottom: 5px;">
        <label style="font-size: 13px;">
          <input type="checkbox" class="chk-lab" value="{?=isset_or($item.kd_jenis_prw)?}" data-nama="{?=isset_or($item.nm_perawatan)?}" data-biaya="{?=isset_or($item.total_byr)?}" {if: in_array($item.kd_jenis_prw, $requested_labs)}checked disabled{/if}>
          {?=isset_or($item.nm_perawatan)?}
        </label>
      </div>
      {/loop}
    </div>
  </div>
  {/loop}
</div>
