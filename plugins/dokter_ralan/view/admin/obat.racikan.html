<div class="rsgm-pasien-box">
  <div class="rsgm-pasien-head">
    <span><i class="fa fa-medkit"></i> Hasil Pencarian Obat Racikan &mdash; Klik baris untuk memilih</span>
    <button type="button" class="rsgm-pasien-close"><i class="fa fa-times"></i> Tutup</button>
  </div>
  <div class="rsgm-pasien-scroll">
    <table class="table table-striped table-hover" width="100%">
      <thead>
        <tr>
          <th width="16%">ID Obat</th>
          <th>Nama Obat</th>
          <th width="15%" class="text-center">Stok</th>
          <th width="24%" class="text-right">Harga</th>
        </tr>
      </thead>
      <tbody>
        {if: $obat}
        {loop: $obat}
        <tr class="pilih_obat_racikan pilih" data-kode_brng="{?=isset_or($value.kode_brng)?}" data-nama_brng="{?=isset_or($value.nama_brng)?}" data-dasar="{?=isset_or($value.dasar)?}" data-stok="{?=isset_or($value.stok)?}">
          <td><span class="rsgm-badge rsgm-badge-slate">{?=isset_or($value.kode_brng)?}</span></td>
          <td><strong>{?=isset_or($value.nama_brng)?}</strong></td>
          <td class="text-center"><span class="rsgm-badge rsgm-badge-emerald">{?=isset_or($value.stok)?}</span></td>
          <td class="text-right" style="font-variant-numeric: tabular-nums; font-weight: 600;">Rp {?= number_format($value.dasar,2,',','.')?}</td>
        </tr>
        {/loop}
        {else}
        <tr>
          <td colspan="4" class="text-center text-muted">Tidak ada data obat.</td>
        </tr>
        {/if}
      </tbody>
    </table>
  </div>
</div>
