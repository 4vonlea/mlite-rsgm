<div class="rsgm-pasien-box">
  <div class="rsgm-pasien-head">
    <span><i class="fa fa-flask"></i> Metode Racikan &mdash; Klik baris untuk memilih</span>
    <button type="button" class="rsgm-pasien-close"><i class="fa fa-times"></i> Tutup</button>
  </div>
  <div class="rsgm-pasien-scroll">
    <table class="table table-striped table-hover" width="100%">
      <thead>
        <tr>
          <th width="22%">ID Racikan</th>
          <th>Nama Metode Racikan</th>
        </tr>
      </thead>
      <tbody>
        {if: $racikan}
        {loop: $racikan}
        <tr class="pilih_racikan pilih" data-kd_racik="{?=isset_or($value.kd_racik)?}" data-nm_racik="{?=isset_or($value.nm_racik)?}" data-kat="racikan">
          <td><span class="rsgm-badge rsgm-badge-purple">{?=isset_or($value.kd_racik)?}</span></td>
          <td><strong>{?=isset_or($value.nm_racik)?}</strong></td>
        </tr>
        {/loop}
        {else}
        <tr>
          <td colspan="2" class="text-center text-muted">Tidak ada data metode racik.</td>
        </tr>
        {/if}
      </tbody>
    </table>
  </div>
</div>
