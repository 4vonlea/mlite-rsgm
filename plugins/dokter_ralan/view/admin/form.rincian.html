<div id="form_rincian" class="rsgm-reg-form clearfix">
  <div class="col-md-12">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-grid">
        <div class="rsgm-reg-col rsgm-reg-col-main">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-stethoscope"></i></span>
              <span>Input Layanan, Resep &amp; Penunjang</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Order Klinis</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label for="rincian_tgl_perawatan" class="col-sm-3 control-label">Tanggal</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-calendar rsgm-field-icon"></i>
                    <input type="text" id="rincian_tgl_perawatan" name="tgl_perawatan" class="form-control tanggal" value="{?=date('Y-m-d')?}">
                  </div>
                </div>
                <label for="rincian_jam_reg" class="col-sm-2 control-label rsgm-label-inline">Jam</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-clock-o rsgm-field-icon"></i>
                    <input type="text" id="rincian_jam_reg" name="jam_reg" class="form-control jam" value="{?=date('H:i:s')?}">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="rincian_no_rawat" class="col-sm-3 control-label">Id Rawat</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-hashtag rsgm-field-icon"></i>
                    <input type="text" id="rincian_no_rawat" name="no_rawat" placeholder="ID Rawat Jalan" class="form-control" value="" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Tindakan</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-search rsgm-field-icon"></i>
                    <input type="text" name="layanan" class="form-control" placeholder="Ketik nama tindakan / layanan..." value="" autocomplete="off">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Resep Non-Racik</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-medkit rsgm-field-icon"></i>
                    <input type="text" name="obat" class="form-control" placeholder="Cari obat / BHP..." value="" autocomplete="off">
                  </div>
                </div>
                <label class="col-sm-2 control-label rsgm-label-inline">Racikan</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-mortar-board rsgm-field-icon"></i>
                    <input type="text" name="racikan" class="form-control" placeholder="Metode racik..." value="" autocomplete="off">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Laboratorium</label>
                <div class="col-sm-4">
                  <div class="input-group">
                    <input type="text" name="laboratorium" class="form-control" placeholder="Cari layanan lab..." value="" autocomplete="off">
                    <span class="input-group-btn">
                      <button class="btn btn-primary" type="button" id="btn_modal_lab" title="Buka Form Checklist Laboratorium" style="height: 34px; border-radius: 0 6px 6px 0 !important; padding: 0 11px;"><i class="fa fa-list-alt"></i></button>
                    </span>
                  </div>
                </div>
                <label class="col-sm-2 control-label rsgm-label-inline">Radiologi</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-heartbeat rsgm-field-icon"></i>
                    <input type="text" name="radiologi" class="form-control" placeholder="Cari radiologi..." value="" autocomplete="off">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="rsgm-reg-col rsgm-reg-col-side rsgm-reg-col-editable">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-id-card-o"></i></span>
              <span>Identitas Pasien &amp; Item Terpilih</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Konfirmasi Input</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-3 control-label">Nomor RM</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-address-card-o rsgm-field-icon"></i>
                    <input type="text" name="no_rkm_medis" class="form-control" placeholder="Nomor Rekam Medik" value="" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Nama Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-user-o rsgm-field-icon"></i>
                    <input type="text" name="nm_pasien" class="form-control" placeholder="Nama pasien" value="" readonly>
                  </div>

              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Jenis Item</label>

                  <input type="hidden" name="kat" class="form-control" value="">
                </div>
                <label class="col-sm-1 control-label rsgm-label-inline">Biaya</label>
                <div class="col-sm-3">
                  <input type="text" id="biaya" name="biaya" class="form-control text-right" placeholder="Rp 0" value="" readonly style="font-variant-numeric: tabular-nums;">

              <div id="daftar_racikan" class="rsgm-rincian-subbox">
                <div class="form-group">
                  <label class="col-sm-3 control-label">Nama Racikan</label>
                  <div class="col-sm-9">
                    <input type="text" id="nama_racik" name="nama_racik" class="form-control" placeholder="Contoh: Puyer Batuk Pilek" value="">

                </div>
                <div id="item_racikan">

                    <label class="col-md-3 control-label"><button type="button" class="btn btn-xs btn-primary add_racikan" title="Tambah baris obat racikan"><span class="fa fa-plus"></span></button> Nama Obat</label>

                    <div class="col-sm-2">
                      <input type="text" name="kandungan" class="form-control text-center" placeholder="0" value="" />

                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-3 control-label">Keterangan</label>
                  <div class="col-sm-9">
                    <textarea name="keterangan" id="keterangan" rows="2" class="form-control" placeholder="Keterangan pembuatan racikan..."></textarea>
                  </div>
                </div>
              </div>

              <div class="form-group" id="aturan_pakai" style="margin-top: 6px;">
                <label class="col-md-3 control-label">Aturan Pakai</label>
                <div class="col-sm-6" style="position: relative;">

                </div>
                <label class="col-sm-1 control-label rsgm-label-inline">Jml</label>
                <div class="col-sm-2">
                  <input type="text" name="jml" id="jml" class="form-control text-center" value="10">
                </div>
              </div>

              <div id="info_tambahan" class="rsgm-rincian-subbox">
                <div class="form-group">
                  <label class="col-sm-3 control-label">Info Tambahan</label>
                  <div class="col-sm-9">
                    <textarea name="informasi_tambahan" id="informasi_tambahan" rows="2" class="form-control" placeholder="Catatan kondisi khusus pasien / kewaspadaan PPI..."></textarea>
                    <div class="rsgm-quick-tags" style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;">
                      <button type="button" class="btn btn-xs btn-danger btn-quick-tag-dr" data-tag="Pasien HIV (+)"><i class="fa fa-tag"></i> HIV (+)</button>
                      <button type="button" class="btn btn-xs btn-warning btn-quick-tag-dr" data-tag="Hepatitis B/C"><i class="fa fa-tag"></i> Hepatitis</button>
                      <button type="button" class="btn btn-xs btn-warning btn-quick-tag-dr" data-tag="TB Paru (Airborne)"><i class="fa fa-tag"></i> TB Paru</button>
                      <button type="button" class="btn btn-xs btn-info btn-quick-tag-dr" data-tag="Suspek Hamil"><i class="fa fa-tag"></i> Hamil</button>
                      <button type="button" class="btn btn-xs btn-primary btn-quick-tag-dr" data-tag="CITO"><i class="fa fa-bolt"></i> CITO</button>
                      <button type="button" class="btn btn-xs btn-default btn-quick-tag-dr" data-tag="Kursi Roda / Brankar"><i class="fa fa-wheelchair"></i> Kursi Roda</button>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="col-sm-3 control-label">Diagnosa Klinis</label>
                  <div class="col-sm-9">
                    <input type="text" name="diagnosa_klinis" class="form-control" placeholder="Indikasi / Diagnosa Klinis" value="">
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <div id="layanan" class="rsgm-pasien-drawer"></div>
      <div id="obat" class="rsgm-pasien-drawer"></div>
      <div id="racikan" class="rsgm-pasien-drawer"></div>
      <div id="obat_racikan" class="rsgm-pasien-drawer"></div>
      <div id="laboratorium" class="rsgm-pasien-drawer"></div>
      <div id="radiologi" class="rsgm-pasien-drawer"></div>

      <div class="rsgm-reg-footer">
        <span class="rsgm-footer-hint hidden-xs">
          <i class="fa fa-info-circle"></i> Cari &amp; pilih item layanan, obat, laboratorium, atau radiologi lalu klik <strong>Masukkan Rincian</strong>
        </span>
        <div class="rsgm-reg-actions">
          <button type="button" name="button" class="btn btn-primary" id="simpan_rincian"><i class="fa fa-save"></i><span class="hidden-xs"> Masukkan Rincian</span></button>
          <button type="button" name="button" class="btn btn-info" id="buka_riwayat_rincian"><i class="fa fa-file-text-o"></i><span class="hidden-xs"> Riwayat Perawatan</span></button>
          <button type="button" name="button" class="btn btn-success" id="selesai"><i class="fa fa-check"></i><span class="hidden-xs"> Selesai</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).on("click", "#form_rincian .rsgm-pasien-close", function(e) {
    e.preventDefault();
    $('#layanan, #obat, #racikan, #obat_racikan, #laboratorium, #radiologi').hide();
  });

  $('input:text[name=laboratorium]').on('input', function(e) {
    var baseURL = mlite.url + '/' + mlite.admin;
    var url = baseURL + '/dokter_ralan/laboratorium?t=' + mlite.token;
    var laboratorium = $('input:text[name=laboratorium]').val();
    if (laboratorium != "") {
      $.post(url, {laboratorium: laboratorium}, function(data) {
        $("#laboratorium").html(data).show();
        $("#layanan").hide();
        $("#obat").hide();
        $("#racikan").hide();
        $("#radiologi").hide();
      });
    } else {
      $("#laboratorium").hide();
    }
  });

  $('input:text[name=aturan_pakai]').on('input',function(e){
    var baseURL = mlite.url + '/' + mlite.admin;
    var url    = baseURL + '/dokter_ralan/aturanpakai?t=' + mlite.token;
    var query = $('input:text[name=aturan_pakai]').val();
    if(query!="") {
        $.ajax({
             url: url,
             method:"POST",
             data:{query:query},
             success:function(data)
             {
                  $('#aturan_pakaiList').fadeIn();
                  $('#aturan_pakaiList').html(data);
             }
        });
    }
    $('#aturan_pakaiList').fadeIn();
  });

  $('#aturan_pakaiList').on('click', 'li', function(){
       $('input:text[name=aturan_pakai]').val($(this).text());
       $('#aturan_pakaiList').fadeOut();
  });
</script>

<script>
  $(function() {
      $('#rawat_jl_dr').hide();
      $('#rawat_jl_pr').hide();
      $('#pilih_provider').change(function(){
          if($('#pilih_provider').val() == 'rawat_jl_dr') {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').hide();
          } else if($('#pilih_provider').val() == 'rawat_jl_pr') {
              $('#rawat_jl_dr').hide();
              $('#rawat_jl_pr').show();
          } else {
              $('#rawat_jl_dr').show();
              $('#rawat_jl_pr').show();
          }
      });
  });
</script>
<script>
  var count=2;
  $(document).on('click', '.add_racikan', function(){
      var html = '';
      html += '<div class="form-group row_racikan">';
      html += '    <label class="col-md-3 control-label"><button type="button" class="btn btn-xs btn-danger remove_racikan"><span class="fa fa-minus"></span></button></label>';
      html += '    <div class="col-md-6">';
      html += '        <select name="kode_brng" class="form-control databarang_ajax">';
      html += '        </select>';
      html += '    </div>';
      html += '    <label for="" class="col-sm-1 control-label rsgm-label-inline">Knd.</label>';
      html += '    <div class="col-sm-2">';
      html += '        <input type="text" name="kandungan" id="kandungan" class="form-control text-center" placeholder="0" value="">';
      html += '    </div>';
      html += '</div>';
      $('#item_racikan').append(html);
      count++;
      var strip_tags = function(str) {
        return (str + '').replace(/<\/?[^>]+(>|$)/g, '')
      };
      var truncate_string = function(str, chars) {
        if ($.trim(str).length <= chars) {
          return str;
        } else {
          return $.trim(str.substr(0, chars)) + '…';
        }
      };
      $('.databarang_ajax').selectator({
        labels: {
          search: 'Cari obat...'
        },
        load: function (search, callback) {
          if (search.length < this.minSearchLength) return callback();
          $.ajax({
            url: '{?=url()?}/{?=ADMIN?}/dokter_ralan/ajax?show=databarang&nama_brng=' + encodeURIComponent(search) + '&t={?=$_SESSION['token']?}',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
              callback(data.slice(0, 100));
            },
            error: function() {
              callback();
            }
          });
        },
        delay: 300,
        minSearchLength: 1,
        valueField: 'kode_brng',
        textField: 'nama_brng'
      });
      $('select').each(function () {
          var options = {
              useDimmer: true,
              useSearch: true,
              labels: {
                  search: '...'
              }
          };
          $.each($(this).data(), function (key, value) {
              options[key] = value;
          });
          $(this).selectator(options);
      });

  });

  $(document).on('click', '.remove_racikan', function(){
      $(this).closest('.row_racikan').remove();
  });
</script>
<script type="text/javascript">
  $("#form_rincian").on("click","#buka_riwayat_rincian", function(event){
    var baseURL = mlite.url + '/' + mlite.admin;
    event.preventDefault();
    var no_rkm_medis = $('input:text[name=no_rkm_medis]').val();
    var loadURL =  baseURL + '/pasien/riwayatperawatan/' + no_rkm_medis + '?t=' + mlite.token;

    var modal = $('#resumeModal');
    var modalContent = $('#resumeModal .modal-content');

    modal.off('show.bs.modal');
    modal.on('show.bs.modal', function () {
        modalContent.load(loadURL);
    }).modal();
    return false;
  });

  $(document).on('click', '.btn-quick-tag-dr', function(e) {
      e.preventDefault();
      var tag = $(this).attr('data-tag');
      var $target = $('#info_tambahan textarea[name=informasi_tambahan]');
      var current = $target.val().trim();
      if (current === '') {
          $target.val(tag);
      } else if (current.indexOf(tag) === -1) {
          $target.val(current + ', ' + tag);
      }
  });
</script>
