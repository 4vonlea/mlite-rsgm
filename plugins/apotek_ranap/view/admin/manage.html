<div class="row" id="manage" style="margin-bottom:100px;">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading rsgm-panel-head">
        <h3 class="panel-title">Kelola Pasien</h3>
        <div class="rsgm-filter-bar">
          <div class="btn-group rsgm-period-group">
            <span class="btn btn-sm dropdown-toggle rsgm-period-btn" data-toggle="dropdown">
              <i class="fa fa-calendar"></i><span>Periode Rawat Inap</span> <span class="caret"></span>
            </span>
            <ul class="dropdown-menu dropdown-menu-right rsgm-period-menu">
              <li>
                <input type="text" id="periode_rawat_inap" class="form-control periode_rawat_inap" name="periode_rawat_inap" required>
              </li>
              <li>
                <input type="text" id="periode_rawat_inap_akhir" class="form-control periode_rawat_inap" name="periode_rawat_inap_akhir" required>
              </li>
              <li>
                <div id="submit_periode_rawat_inap" class="btn btn-default btn-block">Semua</div>
              </li>
              <li>
                <div id="belum_periode_rawat_inap" class="btn btn-default btn-block">Belum Diperiksa</div>
              </li>
              <li>
                <div id="selesai_periode_rawat_inap" class="btn btn-default btn-block">Selesai Diperiksa</div>
              </li>
              <li>
                <div id="lunas_periode_rawat_inap" class="btn btn-default btn-block">Sudah Bayar</div>
              </li>
            </ul>
          </div>
          <div class="rsgm-mode-switch">
            <a href="{?=url([ADMIN,'apotek_ralan','manage'])?}"><i class="fa fa-wheelchair"></i> Apotek Ralan</a>
            <a href="{?=url([ADMIN,'apotek_ranap','manage'])?}" class="active"><i class="fa fa-hotel"></i> Apotek Ranap</a>
          </div>
        </div>
      </div>
      <div class="panel-body">
        <div class="row">
          <div id="notif"></div>
        </div>
        <div id="apotek_ranap" class="display">
          {include: ../plugins/apotek_ranap/view/admin/display.html}
        </div>
        <div class="row">
          {include: ../plugins/apotek_ranap/view/admin/form.rincian.html}
        </div>
        <div>
          <div id="rincian"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
   $(function () {
       $('.periode_rawat_inap').datetimepicker({
         defaultDate: '{?=date('Y-m-d')?}',
         format: 'YYYY-MM-DD',
         locale: 'id'
       });
   });
</script>
