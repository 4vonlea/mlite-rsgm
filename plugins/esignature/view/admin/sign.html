
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=0.1">
    <title>e-Sign</title>
    <link rel="icon" href="{?=url()?}/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="{?=url(MODULES)?}/anjungan/css/bootstrap.min.css">
    <link href="{?=url()?}/assets/css/font-awesome.css" rel="stylesheet">
    <script src="{?=url()?}/assets/jscripts/jquery.min.js"></script>
    <script src="{?=url()?}/assets/jscripts/bootstrap.min.js"></script>
    <script src="{?=url(MODULES)?}/esignature/assets/signature_pad.min.js"></script>
    <script src="{?=url(MODULES)?}/esignature/assets/esignature.js"></script>
    <style>
        .signature-wrapper {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container signature-wrapper">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h3 class="panel-title">Tanda Tangan Elektronik</h3>
                    </div>
                    <div class="panel-body">
                        <div class="alert alert-info">
                            <p>Saya menyatakan bahwa tanda tangan ini sah dan mengikat secara hukum sesuai Peraturan Direktur {?=$this->core->settings->get('settings.nama_instansi')?} dan UU ITE Republik Indonesia.</p>
                            <p><strong>Penandatangan:</strong> {?=isset_or($signer_name)?} ({?=isset_or($signer_role)?})</p>
                        </div>
                        
                        <div class="form-group" style="margin-top: 20px;">
                            <label for="passphrase">Masukkan Kata Sandi (Login) untuk Memverifikasi:</label>
                            <input type="password" id="passphrase" class="form-control" placeholder="Kata Sandi..." style="font-size: 18px; padding: 10px; height: auto;">
                        </div>
                        
                        <br>
                        <button type="button" class="btn btn-primary" id="save"><i class="fa fa-lock"></i> Verifikasi & Tanda Tangani</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    var saveButton = document.getElementById("save");

    saveButton.addEventListener("click", function (event) {
        var passphrase = document.getElementById("passphrase").value;
        if (passphrase.trim() === "") {
            alert("Silakan masukkan kata sandi (passphrase) terlebih dahulu.");
        } else {
            // Disable button during process
            saveButton.disabled = true;
            saveButton.innerHTML = "Memverifikasi...";

            $.post('{?=url([ADMIN, "esignature", "saveSignature"])?}&t={?=$_SESSION['token']?}', {
                ref_type: '{?=isset_or($ref_type)?}',
                ref_id: '{?=isset_or($ref_id)?}',
                signer_role: '{?=isset_or($signer_role)?}',
                signer_id: '{?=isset_or($signer_id)?}',
                signer_name: '{?=isset_or($signer_name)?}',
                passphrase: passphrase
            }, function(response){
                var res = typeof response === 'object' ? response : JSON.parse(response);
                if(res.status == 'success') {
                    // Close window or refresh parent
                    if(window.opener) {
                        try {
                            var $parent = window.opener.jQuery;
                            var container = $parent('#sign_container_{?=isset_or($ref_id)?}');
                            if (container.length) {
                                var verifyUrl = '{?=url(["esignature", "verify"])?}/' + res.hash;
                                var qrClass = 'qr_' + res.hash.substring(0, 8);
                                
                                container.html(
                                    '<div class="' + qrClass + '" style="margin-top:10px;margin-bottom:10px;"></div>' +
                                    '{?=isset_or($signer_name)?}'
                                );
                                
                                $parent('.' + qrClass).qrcode({
                                    width: 120,
                                    height: 120,
                                    text: verifyUrl
                                });
                            }
                        } catch (e) {
                            console.error('Error injecting QR:', e);
                        }
                        window.close();
                    } else {
                        window.location.reload();
                    }
                } else {
                    alert('Gagal: ' + (res.message || 'Kata sandi tidak valid.'));
                    saveButton.disabled = false;
                    saveButton.innerHTML = '<i class="fa fa-lock"></i> Verifikasi & Tanda Tangani';
                }
            }).fail(function(xhr) {
                var res = JSON.parse(xhr.responseText || '{}');
                alert('Gagal: ' + (res.message || 'Terjadi kesalahan pada server.'));
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa fa-lock"></i> Verifikasi & Tanda Tangani';
            });
        }
    });

    // Enter key support
    document.getElementById("passphrase").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            saveButton.click();
        }
    });
</script>
</html>
