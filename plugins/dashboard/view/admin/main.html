<style>
  html {
    height: 0;
    background: url('{?=url()?}/{?=isset_or($settings.wallpaper)?}') no-repeat center center fixed;
    -webkit-background-size: cover;
    -moz-background-size: cover;
    -o-background-size: cover;
    background-size: cover;
  }

  body {
    height: 0;
  }

  #content-wrapper {
    top: 0;
    background: transparent;
  }

  .dashboard_wall {
    position: fixed;
    bottom: 120px;
    left: 80px;
    width: 100%;
    color: {?=isset_or($settings.text_color)?} !important;
  }

  p.title {
    position: absolute;
    bottom: 30px;
    left: 140px;
    font-size: 32px;
    text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
  }

  p.alamat {
    position: absolute;
    bottom: 0px;
    left: 140px;
    font-size: 16px;
    text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
  }

  @media (max-width: 600px) {
    .dashboard_wall {
      position: fixed;
      bottom: 100px;
      left: 0px;
      min-width: 600px;
    }

    img.logo {
      width: 80px;
    }

    p.title {
      position: absolute;
      bottom: 20px;
      left: 80px;
      font-size: 18px;
      text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
    }

    p.alamat {
      position: absolute;
      bottom: 10px;
      left: 80px;
      font-size: 10px;
      text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
    }
  }

  @media (max-width: 768px) and (min-width: 601px) {
    .dashboard_wall {
      position: fixed;
      bottom: 100px;
      left: 0px;
      min-width: 600px;
    }

    img.logo {
      width: 80px;
    }

    p.title {
      position: absolute;
      bottom: 20px;
      left: 80px;
      font-size: 18px;
      text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
    }

    p.alamat {
      position: absolute;
      bottom: 10px;
      left: 80px;
      font-size: 10px;
      text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
    }
  }
</style>

<div class="dashboard_wall">
  <img src="{?=url()?}/{?=isset_or($settings.logo)?}" class="logo" width="120px" alt="">
  <p class="title">{?=isset_or($settings.nama_instansi)?}</p>
  <p class="alamat">{?=isset_or($settings.alamat)?} - {?=isset_or($settings.kota)?} - {?=isset_or($settings.propinsi)?}</p>
</div>
