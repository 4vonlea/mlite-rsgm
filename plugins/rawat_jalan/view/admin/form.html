<div id="form" class="rsgm-reg-form clearfix">
  <div class="col-md-12">
    <div class="rsgm-reg-shell">
      <div class="rsgm-reg-grid">
        <div class="rsgm-reg-col rsgm-reg-col-main">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-stethoscope"></i></span>
              <span>Data Pendaftaran Rawat Jalan</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Poliklinik</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label for="tgl_registrasi" class="col-sm-3 control-label">Tanggal</label>
                <div class="col-sm-4">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-calendar rsgm-field-icon"></i>
                    <input type="text" id="tgl_registrasi" name="tgl_registrasi" class="form-control tanggal" value="{if: $rawat_jalan.reg_periksa.tgl_registrasi == ''}{?=date('Y-m-d')?}{else}{?=isset_or($rawat_jalan.reg_periksa.tgl_registrasi)?}{/if}">
                  </div>
                </div>
                <label for="jam_reg" class="col-sm-2 control-label rsgm-label-inline">Jam</label>
                <div class="col-sm-3">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-clock-o rsgm-field-icon"></i>
                    <input type="text" id="jam_reg" name="jam_reg" class="form-control jam" value="{if: $rawat_jalan.reg_periksa.jam_reg == ''}{?=date('H:i:s')?}{else}{?=isset_or($rawat_jalan.reg_periksa.jam_reg)?}{/if}">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="cari_pasien_input" class="col-sm-3 control-label">Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon rsgm-search-wrap">
                    <i class="fa fa-search rsgm-field-icon"></i>
                    <input type="text" id="cari_pasien_input" name="pasien" class="form-control" placeholder="Ketik Nama / No. RM lalu tekan Enter..." value="">
                    <button type="button" class="rsgm-search-trigger" title="Cari Pasien (Enter)">Cari &#8629;</button>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Poliklinik</label>
                <div class="col-sm-9">
                  <select class="form-control" name="kd_poli">
                    {loop: $rawat_jalan.poliklinik}
                    <option value="{?=isset_or($value.kd_poli)?}"{if: $rawat_jalan.reg_periksa.kd_poli == $value.kd_poli} selected{/if}>{?=isset_or($value.nm_poli)?}</option>
                    {/loop}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Dokter</label>
                <div class="col-sm-9">
                  <select class="form-control" name="kd_dokter">
                    {loop: $rawat_jalan.dokter}
                    <option value="{?=isset_or($value.kd_dokter)?}"{if: $rawat_jalan.reg_periksa.kd_dokter == $value.kd_dokter} selected{/if}>{?=isset_or($value.nm_dokter)?}</option>
                    {/loop}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Penjamin</label>
                <div class="col-sm-9">
                  <select class="form-control" name="kd_pj">
                    {loop: $rawat_jalan.penjab}
                    <option value="{?=isset_or($value.kd_pj)?}"{if: $rawat_jalan.reg_periksa.kd_pj == $value.kd_pj} selected{/if}>{?=isset_or($value.png_jawab)?}</option>
                    {/loop}
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label for="no_rawat" class="col-sm-3 control-label">No. Rawat</label>
                <div class="col-sm-5">
                  <div class="rsgm-input-icon" title="Klik untuk membuat Nomor Rawat otomatis">
                    <i class="fa fa-hashtag rsgm-field-icon"></i>
                    <input type="text" id="no_rawat" name="no_rawat" class="form-control rsgm-auto-input" placeholder="Klik otomatis" value="{?=isset_or($rawat_jalan.reg_periksa.no_rawat)?}" {if: !empty($rawat_jalan.reg_periksa.no_rawat)}disabled{/if}>
                  </div>
                  <input name="no_rawat_baru" class="form-control" type="hidden" value="" id="no_rawat_baru">
                </div>
                <label for="no_reg" class="col-sm-2 control-label rsgm-label-inline">No. Reg</label>
                <div class="col-sm-2">
                  <input type="text" id="no_reg" name="no_reg" class="form-control rsgm-auto-input text-center" placeholder="Auto" title="Klik untuk membuat Nomor Antrian otomatis" value="{?=isset_or($rawat_jalan.reg_periksa.no_reg)?}" {if: !empty($rawat_jalan.reg_periksa.no_reg)}disabled{/if}>
                  <input name="no_reg_baru" class="form-control" type="hidden" value="" id="no_reg_baru">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="rsgm-reg-col rsgm-reg-col-side">
          <div class="rsgm-reg-header">
            <h4 class="rsgm-reg-title">
              <span class="rsgm-reg-icon"><i class="fa fa-id-card-o"></i></span>
              <span>Identitas Pasien</span>
            </h4>
            <span class="rsgm-reg-badge-hint hidden-xs">Ringkasan RM</span>
          </div>
          <div class="rsgm-reg-body">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-3 control-label">Nomor RM</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-address-card-o rsgm-field-icon"></i>
                    <input type="text" name="no_rkm_medis" class="form-control" placeholder="Terisi otomatis saat pilih pasien" value="{?=isset_or($rawat_jalan.reg_periksa.no_rkm_medis)?}" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Nama Pasien</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-user-o rsgm-field-icon"></i>
                    <input type="text" name="nm_pasien" class="form-control" placeholder="Nama lengkap pasien" value="{?=isset_or($rawat_jalan.reg_periksa.nm_pasien)?}" readonly>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Tgl. Lahir</label>
                <div class="col-sm-4">
                  <input type="text" name="tgl_lahir" class="form-control" placeholder="YYYY-MM-DD" value="{?=isset_or($rawat_jalan.reg_periksa.tgl_lahir)?}" readonly>
                </div>
                <label class="col-sm-2 control-label rsgm-label-inline">Kelamin</label>
                <div class="col-sm-3">
                  <input type="text" name="jk" class="form-control" placeholder="L / P" value="{if: $rawat_jalan.reg_periksa.jk == 'L'}Laki-Laki{/if}{if: $rawat_jalan.reg_periksa.jk == 'P'}Perempuan{/if}" readonly>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Telepon</label>
                <div class="col-sm-9">
                  <div class="rsgm-input-icon">
                    <i class="fa fa-phone rsgm-field-icon"></i>
                    <input type="text" name="no_tlp" class="form-control" placeholder="Nomor telepon / HP" value="{?=isset_or($rawat_jalan.reg_periksa.no_tlp)?}" readonly>
                  </div>
                </div>
              </div>
              <div id="stts_daftar"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="pasien" class="rsgm-pasien-drawer"></div>

      <div class="rsgm-reg-footer">
        <span class="rsgm-footer-hint hidden-xs">
          <i class="fa fa-info-circle"></i> Klik kolom <strong>No. Rawat</strong> &amp; <strong>No. Reg</strong> untuk mengisi nomor otomatis
        </span>
        <div class="rsgm-reg-actions">
          <button type="button" name="button" class="btn btn-primary" id="simpan" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_create', 'rawat_jalan') == false}disabled{/if}><i class="fa fa-save"></i><span class="hidden-xs"> Simpan</span></button>
          {if: !empty($rawat_jalan.reg_periksa.no_rawat)}
          <a href="{?=url([ADMIN, 'form_rme', 'form'])?}&no_rawat={?=isset_or($rawat_jalan.reg_periksa.no_rawat)?}" class="btn btn-info"><i class="fa fa-stethoscope"></i><span class="hidden-xs"> Asesmen Gigi UGD</span></a>
          {/if}
          <button type="button" name="button" class="btn btn-danger" id="hapus" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_delete', 'rawat_jalan') == false}disabled{/if}><i class="fa fa-trash-o"></i><span class="hidden-xs"> Hapus</span></button>
          <button type="button" name="button" class="btn btn-default" id="batal"><i class="fa fa-times"></i><span class="hidden-xs"> Batal</span></button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript">
  function cariPasienRawatJalan() {
    var baseURL = mlite.url + '/' + mlite.admin;
    var url = baseURL + '/rawat_jalan/pasien?t=' + mlite.token;
    var cari = $('input:text[name=pasien]').val();
    if (cari !== "") {
      $.post(url, {cari: cari}, function(data) {
        $("#pasien").html(data).show();
      });
    } else {
      $("#pasien").hide();
    }
  }

  if (window.location.search.indexOf('no_rkm_medis') !== -1) {
    let searchParams = new URLSearchParams(window.location.search);
    $('input:text[name=pasien]').val(searchParams.get('no_rkm_medis'));
    cariPasienRawatJalan();
  }

  $('select').selectator();

  $('input:text[name=pasien]').on('keydown', function(e) {
    var key = e.which || e.keyCode;
    if (key == 13) {
      e.preventDefault();
      cariPasienRawatJalan();
    }
  });

  $('.rsgm-search-trigger').on('click', function(e) {
    e.preventDefault();
    cariPasienRawatJalan();
  });

  $("#pasien").on("click", ".rsgm-pasien-close", function(e) {
    e.preventDefault();
    $("#pasien").hide();
  });

  $("#batal").on("click", function() {
    $("#stts_daftar").hide();
  });

  // ketika baris data diklik
  $("#pasien").on("click", ".pilih", function(event) {
    var baseURL = mlite.url + '/' + mlite.admin;
    event.preventDefault();

    var no_rkm_medis = $(this).attr("data-no_rkm_medis");
    var nm_pasien    = $(this).attr("data-nm_pasien");
    var tgl_lahir    = $(this).attr("data-tgl_lahir");
    var jk           = $(this).attr("data-jk");
    var alamat       = $(this).attr("data-alamat");
    var no_tlp       = $(this).attr("data-no_tlp");
    var pekerjaan    = $(this).attr("data-pekerjaan");

    var url = baseURL + '/rawat_jalan/statusdaftar?t=' + mlite.token;

    $.post(url, {no_rkm_medis: no_rkm_medis}, function(data) {
      $("#stts_daftar").html(data).show();
    });

    $('input:text[name=no_rkm_medis]').val(no_rkm_medis);
    $('input:text[name=nm_pasien]').val(nm_pasien);
    $('input:text[name=tgl_lahir]').val(tgl_lahir);
    $('input:text[name=jk]').val(jk);
    $('input:text[name=alamat]').val(alamat);
    $('input:text[name=no_tlp]').val(no_tlp);
    $('input:text[name=pekerjaan]').val(pekerjaan);

    $("#pasien").hide();
  });
</script>
<script type="text/javascript">
  $(function () {
    $('.tanggal_jam').datetimepicker({
      format: 'YYYY-MM-DD HH:mm:ss',
      locale: 'id'
    });
  });
  $(function () {
    $('.tanggal').datetimepicker({
      format: 'YYYY-MM-DD',
      locale: 'id'
    });
  });
  $(function () {
    $('.jam').datetimepicker({
      format: 'HH:mm:ss',
      locale: 'id'
    });
  });
</script>
